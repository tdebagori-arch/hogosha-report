<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保護者連絡</title>
<style>
:root {
  --blue:#2563EB; --blue-dk:#1D4ED8; --blue-l:#EFF6FF;
  --green:#10B981; --green-l:#ECFDF5;
  --red:#EF4444; --red-l:#FEF2F2;
  --purple:#7C3AED; --purple-l:#F5F3FF;
  --orange:#B45309; --orange-l:#FFFBEB;
  --teal:#0F766E; --teal-l:#F0FDFA;
  --gray:#64748B; --gray-l:#F1F5F9; --gray-bd:#E2E8F0;
  --navy:#0F172A; --white:#FFFFFF;
  --r:12px; --r-sm:8px; --nav-h:60px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --blue:#3B82F6; --blue-dk:#93C5FD; --blue-l:rgba(59,130,246,0.18);
    --green:#34D399; --green-l:rgba(52,211,153,0.18);
    --red:#F87171; --red-l:rgba(248,113,113,0.18);
    --purple:#A78BFA; --purple-l:rgba(167,139,250,0.18);
    --orange:#FBBF24; --orange-l:rgba(251,191,36,0.18);
    --teal:#5EEAD4; --teal-l:rgba(94,234,212,0.16);
    --gray:#94A3B8; --gray-l:#0B1220; --gray-bd:#2A3446;
    --navy:#E2E8F0; --white:#1A2333;
  }
  .badge-小学生{color:#6EE7B7;}
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;background:var(--gray-l);color:var(--navy);min-height:100dvh;padding-bottom:var(--nav-h);}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--white);border-top:1px solid var(--gray-bd);display:flex;z-index:100;}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--gray);border:none;background:none;font-size:10px;font-weight:600;transition:color 0.15s;}
.nav-tab .ni{font-size:22px;line-height:1;}
.nav-tab.active{color:var(--blue);}

/* SCREENS */
.screen{display:none;flex-direction:column;min-height:calc(100dvh - var(--nav-h));}
.screen.active{display:flex;}

/* PAGE HEADER */
.page-hd{background:var(--white);border-bottom:1px solid var(--gray-bd);padding:14px 16px;position:sticky;top:0;z-index:50;}
.page-hd h1{font-size:18px;font-weight:700;}
.page-hd-sub{font-size:12px;color:var(--gray);margin-top:1px;}

/* SEARCH BAR */
.search-bar{background:var(--white);border-bottom:1px solid var(--gray-bd);padding:10px 16px;}

/* STAT BAR */
.stat-bar{background:var(--white);border-bottom:1px solid var(--gray-bd);display:flex;padding:14px 20px;gap:24px;}
.stat-item{text-align:center;}
.stat-num{font-size:26px;font-weight:800;}
.stat-num.blue{color:var(--blue);}
.stat-num.green{color:var(--green);}
.stat-num.red{color:var(--red);}
.stat-label{font-size:11px;color:var(--gray);font-weight:600;}

/* STUDENT CARD (home) */
.student-list{flex:1;overflow-y:auto;}
.student-card{background:var(--white);border-bottom:1px solid var(--gray-bd);display:flex;align-items:center;padding:14px 16px;gap:12px;cursor:pointer;transition:background 0.1s;}
.student-card:active{background:var(--gray-l);}
.sc-bar{width:4px;height:44px;border-radius:2px;flex-shrink:0;}
.sc-bar.sent{background:var(--green);}
.sc-bar.unsent{background:var(--red);}
.sc-info{flex:1;min-width:0;}
.sc-name{font-size:16px;font-weight:600;}
.sc-meta{font-size:12px;color:var(--gray);margin-top:2px;}
.sc-badges{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;}
.sc-arrow{color:var(--gray);font-size:18px;}

/* BADGES */
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;}
.badge-高校生{background:var(--purple-l);color:var(--purple);}
.badge-中学生{background:var(--blue-l);color:var(--blue-dk);}
.badge-小学生{background:var(--green-l);color:#065F46;}
.badge-sent{background:var(--green-l);color:var(--green);}
.badge-unsent{background:var(--red-l);color:var(--red);}
.badge-optional{background:var(--gray-l);color:var(--gray);border:1px dashed var(--gray-bd);}

/* WEEK PANEL (home) */
.week-panel{background:var(--white);border-bottom:1px solid var(--gray-bd);padding:12px 16px;}
.week-head{display:flex;flex-direction:column;gap:2px;}
.week-title{font-size:13px;font-weight:700;color:var(--gray);}
.week-nums{font-size:14px;font-weight:700;}
.week-nums b{font-size:22px;font-weight:800;}
.week-nums .g{color:var(--green);}
.week-nums .r{color:var(--red);}
.week-bar{height:8px;border-radius:4px;background:var(--gray-l);margin-top:8px;overflow:hidden;}
.week-bar-fill{height:100%;background:var(--green);border-radius:4px;transition:width 0.3s;}
.week-actions{display:flex;gap:8px;margin-top:10px;}
.week-actions .btn{padding:10px 6px;font-size:13px;}
.week-actions:empty{display:none;}
.sc-days{font-size:11px;color:var(--gray);}
.sc-days.long{color:var(--red);font-weight:700;}

/* BATCH (まとめて作る) */
.batch-opts{background:var(--white);border-bottom:1px solid var(--gray-bd);padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--gray);}
.batch-opts .chip-wrap{padding:0;}
.batch-opts .chip{padding:5px 12px;}
.batch-row{background:var(--white);border-bottom:1px solid var(--gray-bd);padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
.batch-row-hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.batch-row-hd .sc-name{font-size:15px;margin-right:2px;}
.batch-kinds{display:flex;gap:6px;}
.batch-kinds .chip{padding:5px 10px;font-size:12px;}
.batch-row .note-input{font-size:13px;}
.bstat{margin-left:auto;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--gray-l);color:var(--gray);white-space:nowrap;}
.bstat.run{background:var(--blue-l);color:var(--blue-dk);}
.bstat.done{background:var(--green-l);color:var(--green);}
.bstat.failed{background:var(--red-l);color:var(--red);}
.bstat.ready{background:var(--orange-l);color:var(--orange);}
.bstat.run::before{content:'';display:inline-block;width:8px;height:8px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 0.7s linear infinite;margin-right:4px;vertical-align:-1px;}
.batch-msg{font-size:12px;line-height:1.5;color:var(--gray);}
.batch-msg:empty{display:none;}
.batch-msg.err{color:var(--red);}
.batch-msg .btn{display:inline-block;width:auto;padding:6px 12px;font-size:12px;margin:6px 6px 0 0;}
.sticky-foot{position:sticky;bottom:var(--nav-h);background:var(--white);border-top:1px solid var(--gray-bd);padding:10px 16px;z-index:40;}

/* LEVEL TABS (home) */
.level-tabs{background:var(--white);border-bottom:1px solid var(--gray-bd);display:flex;overflow-x:auto;padding:0 8px;}
.level-tab{flex:1;min-width:72px;border:none;background:none;padding:12px 6px 10px;font-size:14px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;}
.level-tab.active{color:var(--blue);border-bottom-color:var(--blue);}
.level-tab .lt-count{font-size:11px;font-weight:700;background:var(--gray-l);color:var(--gray);border-radius:10px;padding:1px 7px;}
.level-tab .lt-count.has-unsent{background:var(--red-l);color:var(--red);}
.grade-tabs{background:var(--white);border-bottom:1px solid var(--gray-bd);display:flex;gap:6px;overflow-x:auto;padding:8px 16px;}
.grade-tab{flex-shrink:0;border:1px solid var(--gray-bd);background:var(--white);color:var(--navy);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;}
.grade-tab.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.grade-tab .gt-unsent{font-size:10px;font-weight:700;background:var(--red);color:#fff;border-radius:10px;padding:0 6px;line-height:16px;}
.badge-type-class{background:var(--gray-l);color:var(--gray);}
.badge-type-pretest{background:var(--teal-l);color:var(--teal);}
.badge-type-test{background:var(--orange-l);color:var(--orange);}

/* TYPE SELECT */
.type-choice{display:flex;flex-direction:column;gap:12px;padding:20px 16px;}
.type-card{background:var(--white);border:2px solid var(--gray-bd);border-radius:var(--r);padding:18px;text-align:left;cursor:pointer;transition:all 0.12s;}
.type-card:active{transform:scale(0.98);background:var(--gray-l);}
.type-card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.type-card-title{font-size:16px;font-weight:700;}
.type-card-sub{font-size:12px;color:var(--gray);margin-top:4px;}

/* CREATE SCREEN */
.create-hd{background:var(--white);border-bottom:1px solid var(--gray-bd);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
.back-btn{border:none;background:none;font-size:28px;cursor:pointer;padding:0 4px;line-height:1;color:var(--navy);}
.create-hd-info{flex:1;}
.create-hd-name{font-size:16px;font-weight:700;}
.create-hd-sub{font-size:12px;color:var(--gray);}

.create-body{flex:1;overflow-y:auto;padding-bottom:24px;}
.create-step{background:var(--white);margin-top:12px;border-top:1px solid var(--gray-bd);border-bottom:1px solid var(--gray-bd);}
.step-label{font-size:11px;font-weight:700;color:var(--gray);padding:12px 16px 8px;letter-spacing:0.06em;text-transform:uppercase;}

/* EVAL BUTTONS */
.eval-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 14px;}
.eval-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:var(--r-sm);border:2px solid var(--gray-bd);background:var(--white);cursor:pointer;transition:all 0.12s;user-select:none;}
.eval-btn:active{transform:scale(0.95);}
.eval-btn .e-emoji{font-size:22px;line-height:1;}
.eval-btn .e-label{font-size:11px;color:var(--gray);text-align:center;line-height:1.3;white-space:pre-line;}
.eval-btn.sel{border-color:var(--blue);background:var(--blue-l);}
.eval-btn.sel .e-label{color:var(--blue-dk);}

/* CHIPS */
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 14px;}
.chip{padding:8px 14px;border-radius:20px;border:2px solid var(--gray-bd);background:var(--white);font-size:13px;cursor:pointer;transition:all 0.12s;user-select:none;white-space:nowrap;}
.chip:active{transform:scale(0.95);}
.chip.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-dk);}

/* NOTE */
.note-wrap{padding:0 16px 14px;}
.note-input{width:100%;border:2px solid var(--gray-bd);border-radius:var(--r-sm);padding:10px 12px;font-family:inherit;font-size:14px;resize:none;outline:none;line-height:1.6;}
.note-input:focus{border-color:var(--blue);}

/* BUTTONS */
.btn{display:block;width:100%;padding:14px;border-radius:var(--r);border:none;font-size:15px;font-weight:700;cursor:pointer;transition:opacity 0.15s;text-align:center;font-family:inherit;}
.btn:active{opacity:0.75;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-blue{background:var(--blue);color:white;}
.btn-green{background:var(--green);color:white;}
.btn-outline{background:transparent;border:2px solid var(--gray-bd);color:var(--navy);}
.btn-red-outline{background:transparent;border:2px solid var(--red);color:var(--red);}

.gen-wrap{padding:12px 16px 0;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{flex:1;}

/* RESULT */
#result-section{padding:14px 16px;display:none;flex-direction:column;gap:10px;}
#result-section.visible{display:flex;}
.result-label{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:0.06em;}
.result-ta{width:100%;border:2px solid var(--gray-bd);border-radius:var(--r-sm);padding:12px;font-family:inherit;font-size:14px;line-height:1.8;resize:vertical;outline:none;min-height:160px;}
.result-ta:focus{border-color:var(--blue);}

/* NEGA CHECK & BLOG */
.check-box{border:2px solid var(--gray-bd);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;line-height:1.6;background:var(--white);}
.check-box.ok{border-color:var(--green);background:var(--green-l);}
.check-box.warn{border-color:var(--orange);background:var(--orange-l);}
.check-box.bad{border-color:var(--red);background:var(--red-l);}
.check-box.loading{color:var(--gray);}
.check-head{font-weight:700;margin-bottom:4px;}
.check-issue{padding:8px 0;border-top:1px dashed var(--gray-bd);}
.check-issue:first-of-type{border-top:none;}
.check-tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;margin-right:6px;color:white;background:var(--orange);}
.check-tag.must{background:var(--red);}
.check-quote{font-weight:600;}
.check-sugg{color:var(--teal);margin-top:2px;}
.check-actions{display:flex;gap:8px;margin-top:8px;}
.check-actions .btn{padding:9px;font-size:13px;}
.section-sep{height:1px;background:var(--gray-bd);margin:10px 0 4px;}
.blog-toggle{display:flex;align-items:center;gap:8px;padding:0 16px 14px;font-size:14px;}
.blog-toggle input{width:18px;height:18px;}
.blog-toggle select{flex:1;}

/* KARTE (生徒カルテ) */
.karte-btn{border:none;background:var(--purple-l);color:var(--purple);border-radius:20px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:inherit;}
.karte-body{flex:1;overflow-y:auto;padding-bottom:24px;}
.karte-sec{background:var(--white);margin-top:12px;border-top:1px solid var(--gray-bd);border-bottom:1px solid var(--gray-bd);padding-bottom:12px;}
.karte-add{padding:0 16px;display:flex;flex-direction:column;gap:8px;}
.note-item{display:flex;gap:8px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--gray-bd);}
.note-item-main{flex:1;min-width:0;}
.note-item-meta{font-size:11px;color:var(--gray);margin-bottom:2px;display:flex;gap:6px;align-items:center;}
.note-item-text{font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.note-cat{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;background:var(--purple-l);color:var(--purple);}
.note-cat.c-好きなこと{background:var(--orange-l);color:var(--orange);}
.note-cat.c-学習{background:var(--blue-l);color:var(--blue-dk);}
.note-cat.c-家庭・部活{background:var(--teal-l);color:var(--teal);}
.cand-item{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:13px;line-height:1.5;}
.cand-item input{margin-top:3px;width:16px;height:16px;flex-shrink:0;}
.karte-box{border-color:var(--purple);background:var(--purple-l);}

/* HISTORY */
.history-list{flex:1;overflow-y:auto;}
.history-item{background:var(--white);border-bottom:1px solid var(--gray-bd);padding:14px 16px;cursor:pointer;transition:background 0.1s;}
.history-item:active{background:var(--gray-l);}
.hi-meta{font-size:11px;color:var(--gray);margin-bottom:3px;display:flex;align-items:center;gap:6px;}
.hi-name{font-size:15px;font-weight:600;margin-bottom:4px;}
.hi-preview{font-size:13px;color:var(--gray);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:var(--white);border-radius:20px 20px 0 0;padding:24px;width:100%;max-height:88dvh;overflow-y:auto;}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;}

/* SETTINGS */
.sub-tabs{display:flex;background:var(--white);border-bottom:1px solid var(--gray-bd);}
.sub-tab{flex:1;padding:12px 4px;border:none;background:none;cursor:pointer;font-size:12px;color:var(--gray);border-bottom:2px solid transparent;font-weight:600;transition:color 0.15s;}
.sub-tab.active{color:var(--blue);border-bottom-color:var(--blue);}

.settings-body{flex:1;overflow-y:auto;padding-bottom:24px;}
.settings-group{margin:12px 16px 0;}
.settings-group label{display:block;font-size:13px;font-weight:600;color:var(--gray);margin-bottom:6px;}
.settings-input{width:100%;border:2px solid var(--gray-bd);border-radius:var(--r-sm);padding:11px 12px;font-size:14px;font-family:inherit;outline:none;background:var(--white);}
.settings-input:focus{border-color:var(--blue);}
.settings-ta{width:100%;border:2px solid var(--gray-bd);border-radius:var(--r-sm);padding:11px 12px;font-size:13px;font-family:inherit;resize:vertical;outline:none;line-height:1.6;min-height:120px;}
.settings-ta:focus{border-color:var(--blue);}
.settings-hint{font-size:12px;color:var(--gray);margin-top:5px;line-height:1.5;}
.api-ok{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;margin-left:8px;}
.api-ok.set{background:var(--green-l);color:var(--green);}
.api-ok.none{background:var(--red-l);color:var(--red);}

/* STUDENT LIST (settings) */
.st-item{background:var(--white);border-bottom:1px solid var(--gray-bd);display:flex;align-items:center;padding:12px 16px;gap:10px;}
.st-item-info{flex:1;min-width:0;}
.st-item-name{font-size:14px;font-weight:600;}
.st-item-meta{font-size:12px;color:var(--gray);margin-top:2px;}
.icon-btn{border:none;background:none;cursor:pointer;font-size:20px;padding:4px;flex-shrink:0;}

/* TOAST */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#1E293B;color:white;padding:10px 20px;border-radius:20px;font-size:14px;z-index:500;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

/* LOADING */
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:400;align-items:center;justify-content:center;}
.loading-overlay.open{display:flex;}
.loading-box{background:var(--white);border-radius:var(--r);padding:32px 28px;text-align:center;min-width:200px;}
.spinner{width:40px;height:40px;border:3px solid var(--gray-bd);border-top-color:var(--blue);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:14px;color:var(--gray);}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 24px;color:var(--gray);}
.empty .big{font-size:48px;margin-bottom:12px;}
.empty p{font-size:14px;line-height:1.6;}

/* LOGIN */
body.logged-out .bottom-nav{display:none;}
.login-wrap{max-width:360px;margin:0 auto;width:100%;padding:48px 24px;}
.login-title{font-size:22px;font-weight:800;text-align:center;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--gray);text-align:center;margin-bottom:24px;}
.login-error{color:var(--red);font-size:13px;margin-top:10px;text-align:center;min-height:16px;}

/* MIC BUTTON */
.note-row{display:flex;gap:8px;align-items:flex-start;}
.note-row .note-input{flex:1;}
.video-row{display:flex;gap:8px;margin-top:8px;}
.video-row .settings-input{flex:1;min-width:0;}
.video-btn{width:auto;padding:0 14px;font-size:13px;white-space:nowrap;}
.mic-btn{width:44px;height:44px;flex-shrink:0;font-size:20px;border:2px solid var(--gray-bd);border-radius:var(--r-sm);background:var(--white);cursor:pointer;}
.mic-btn.recording{border-color:var(--red);color:var(--red);animation:mic-pulse 1s infinite;}
@keyframes mic-pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
</style>
</head>
<body>

<!-- ── LOGIN SCREEN ── -->
<div id="screen-login" class="screen active">
  <div class="login-wrap">
    <div class="login-title">保護者連絡</div>
    <div class="login-sub">ログインしてください</div>
    <div class="settings-group" style="margin:0 0 12px;">
      <label>メールアドレス</label>
      <input class="settings-input" type="email" id="login-email" autocomplete="username">
    </div>
    <div class="settings-group" style="margin:0 0 16px;">
      <label>パスワード</label>
      <input class="settings-input" type="password" id="login-password" autocomplete="current-password">
    </div>
    <button class="btn btn-blue" onclick="doLogin()">ログイン</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── HOME SCREEN ── -->
<div id="screen-home" class="screen">
  <div class="page-hd">
    <h1>保護者連絡</h1>

// Legacy localStorage shape → normalized {class:[], test:[]} per level (used for one-time migration only)
function normalizeLegacyStyles(raw) {
  const out = {};
  LEVELS.forEach(lv => {
    const v = raw[lv];
    const entry = {class: [], test: []};
    if (Array.isArray(v)) {
      entry.class = v;
    } else if (v && typeof v === 'object') {
      entry.class = Array.isArray(v.class) ? v.class : [];
      entry.test  = Array.isArray(v.test)  ? v.test  : [];
    } else if (typeof v === 'string' && v.trim()) {
      entry.class = [{id: uid(), text: v.trim()}];
    }
    out[lv] = entry;
  });

function normalizeStyleDocs(docs) {
  const out = {};
  LEVELS.forEach(lv => out[lv] = {class: [], pretest: [], test: []});
  docs.forEach(sp => {
    if (!out[sp.level]) return;
    const type = (sp.type === 'test' || sp.type === 'pretest') ? sp.type : 'class';
    out[sp.level][type].push({id: sp.id, text: sp.text});
  });
  return out;
}

function rerenderCurrentScreen() {
  const active = document.querySelector('.screen.active');
  if (!active) return;
  if (active.id === 'screen-home')     renderHome();
  if (active.id === 'screen-history')  renderHistory();
  if (active.id === 'screen-settings') renderSettings();
  if (active.id === 'screen-karte')    renderKarte();
  if (active.id === 'screen-batch')    refreshBatch();
}

function subscribeAll(uid) {
  const { db, collection, doc, onSnapshot } = window.fb;
  fsUnsubs.push(onSnapshot(collection(db, 'users', uid, 'students'), snap => {
    studentsCache = snap.docs.map(d => ({id: d.id, ...d.data()}));
    rerenderCurrentScreen();
  }));
  fsUnsubs.push(onSnapshot(collection(db, 'users', uid, 'reports'), snap => {
    reportsCache = snap.docs.map(d => ({id: d.id, ...d.data()}))
      .sort((a,b) => (b.sentAt||'').localeCompare(a.sentAt||''));
    rerenderCurrentScreen();
  }));
  fsUnsubs.push(onSnapshot(collection(db, 'users', uid, 'styles'), snap => {
    stylesCache = normalizeStyleDocs(snap.docs.map(d => ({id: d.id, ...d.data()})));
    rerenderCurrentScreen();
  }));
  fsUnsubs.push(onSnapshot(collection(db, 'users', uid, 'notes'), snap => {
    notesCache = snap.docs.map(d => ({id: d.id, ...d.data()}))
      .sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));
    rerenderCurrentScreen();
  }));
  fsUnsubs.push(onSnapshot(collection(db, 'users', uid, 'drafts'), snap => {
    draftsCache = snap.docs.map(d => ({id: d.id, ...d.data()}));
    rerenderCurrentScreen();
  }));
  fsUnsubs.push(onSnapshot(doc(db, 'users', uid, 'settings', 'main'), d => {
    settingsCache = d.exists() ? d.data() : {};
    rerenderCurrentScreen();
  }));
}

function unsubscribeAll() {
  fsUnsubs.forEach(u => u());
  fsUnsubs = [];
  studentsCache = []; reportsCache = []; stylesCache = {}; settingsCache = {}; notesCache = []; draftsCache = [];
}

async function migrateLocalDataIfNeeded(uid) {
  if (localStorage.getItem('pr_migrated')) return;
  const localStudents  = load(K.students, []);
  const localReports   = load(K.reports, []);
  const localStyles    = normalizeLegacyStyles(load(K.styles, {}));
  const localApiKey    = localStorage.getItem(K.apiKey) || '';
  const hasStyles = LEVELS.some(lv => localStyles[lv].class.length || localStyles[lv].test.length);

  if (!localStudents.length && !localReports.length && !hasStyles && !localApiKey) {
    localStorage.setItem('pr_migrated', '1');
    return;
  }

  const { db, doc, writeBatch } = window.fb;
  const batch = writeBatch(db);
  localStudents.forEach(s => {
    const { id, ...rest } = s;
    batch.set(doc(db, 'users', uid, 'students', id), rest);
  });
  localReports.forEach(r => {
    const { id, ...rest } = r;
    batch.set(doc(db, 'users', uid, 'reports', id), rest);
  });
  LEVELS.forEach(lv => ['class','test'].forEach(type =>
    (localStyles[lv][type] || []).forEach(sp =>
      batch.set(doc(db, 'users', uid, 'styles', sp.id), {level: lv, type, text: sp.text})
    )
  ));
  if (localApiKey) batch.set(doc(db, 'users', uid, 'settings', 'main'), {apiKey: localApiKey});

  await batch.commit();
  localStorage.setItem('pr_migrated', '1');
  showToast('データをクラウドに移行しました');
}

function exportBackup() {
  const data = {
    exportedAt: new Date().toISOString(),
    students: getStudents(),
    reports:  getReports(),
    styles:   getStyles(),
    notes:    notesCache,
    drafts:   draftsCache,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `hogosha-report-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('バックアップをダウンロードしました');
}

async function importBackup(input) {
  const file = input.files[0];
  if (!file) return;
  if (!confirm('バックアップを読み込みます。同じIDのデータは上書きされます。よろしいですか？')) {
    input.value = '';
    return;
  }
  try {
    const data = JSON.parse(await file.text());
    const { db, doc, writeBatch } = window.fb;
    const batch = writeBatch(db);
    (data.students || []).forEach(s => {
      const { id, ...rest } = s;
      batch.set(doc(db, 'users', fbUser.uid, 'students', id || uid()), rest);
    });
    (data.reports || []).forEach(r => {
      const { id, ...rest } = r;
      batch.set(doc(db, 'users', fbUser.uid, 'reports', id || uid()), rest);
    });
    (data.notes || []).forEach(n => {
      const { id, ...rest } = n;
      batch.set(doc(db, 'users', fbUser.uid, 'notes', id || uid()), rest);
    });
    (data.drafts || []).forEach(d => {
      const { id, ...rest } = d;
      if (id) batch.set(doc(db, 'users', fbUser.uid, 'drafts', id), rest);
    });
    const styles = data.styles || {};
    LEVELS.forEach(lv => ['class','pretest','test'].forEach(type =>
      ((styles[lv] || {})[type] || []).forEach(sp =>
        batch.set(doc(db, 'users', fbUser.uid, 'styles', sp.id || uid()), {level: lv, type, text: sp.text})
      )
    ));
    await batch.commit();
    showToast('インポートが完了しました');
  } catch (e) {
    showToast('インポートに失敗しました: ' + (e.message || ''));
  } finally {
    input.value = '';
  }
}

function showLoginScreen() {

  document.getElementById('screen-login').classList.add('active');

function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';

// ─── UTILS ───────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function currentYM() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function isTypeSentThisMonth(studentId, type) {
  const m = currentYM();
  return getReports().some(r =>
    r.studentId === studentId && (r.reportType || 'class') === type && r.sentAt && r.sentAt.startsWith(m)
  );
}

// ─── 週（月曜はじまり）────────────────────────────────────
function weekStart(d) {
  const x = new Date(d || Date.now());
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}

function ymdKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function currentWeekKey() { return ymdKey(weekStart()); }

function weekRangeLabel() {
  const s = weekStart();
  const e = new Date(s); e.setDate(s.getDate() + 6);
  return `${s.getMonth()+1}/${s.getDate()}〜${e.getMonth()+1}/${e.getDate()}`;
}

// 通常授業は週ごと、テスト前・テスト振り返りは月ごとに数える
function isClassSentThisWeek(studentId) {
  const from = weekStart().getTime();
  return getReports().some(r =>
    r.studentId === studentId && (r.reportType || 'class') === 'class' && r.sentAt && new Date(r.sentAt).getTime() >= from
  );
}

function isTypeSentInPeriod(studentId, type) {
  return type === 'class' ? isClassSentThisWeek(studentId) : isTypeSentThisMonth(studentId, type);
}

// 前回の通常授業報告からの日数（送ったことがなければ null）
function daysSinceClassSent(studentId) {
  const last = lastSentAt(studentId, 'class');
  if (!last) return null;
  const a = new Date(last); a.setHours(0, 0, 0, 0);
  const b = new Date();     b.setHours(0, 0, 0, 0);
  return Math.round((b - a) / 86400000);
}

function daysSinceLabel(studentId) {
  const n = daysSinceClassSent(studentId);
  if (n === null) return `<span class="sc-days long">通常授業の送信なし</span>`;
  return `<span class="sc-days${n >= 7 ? ' long' : ''}">前回 ${n === 0 ? '今日' : n + '日前'}</span>`;
}

function lastSentAt(studentId, type) {
  return getReports()
    .filter(r => r.studentId === studentId && (r.reportType || 'class') === type && r.sentAt)
    .reduce((max, r) => r.sentAt > max ? r.sentAt : max, '') || null;
}

function fmtMD(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()}`;
}

// 種別ごとの送信状況バッジ。通常授業は今週、ほかは今月。テスト前は任意なので未送信でも赤にせずグレー＋前回日付
function typeStatusBadge(studentId, type, withLabel) {
  const prefix = withLabel ? `${REPORT_TYPE_LABEL[type]}: ` : '';
  const sent = isTypeSentInPeriod(studentId, type);
  if (type === 'class') {
    return `<span class="badge badge-${sent?'sent':'unsent'}">${prefix}${sent?'✓今週送信済':'今週まだ'}</span>`;
  }
  if (type !== 'pretest') {
    return `<span class="badge badge-${sent?'sent':'unsent'}">${prefix}${sent?'✓送信済':'未送信'}</span>`;
  }
  const last = lastSentAt(studentId, type);
  if (sent) return `<span class="badge badge-sent">${prefix}✓${fmtMD(last)}送信</span>`;
  return `<span class="badge badge-optional">${prefix}${last ? `前回 ${fmtMD(last)}` : '未送信'}</span>`;
}

// 必須の報告（通常授業は今週分、テスト振り返りは今月分）がそろっているか
function isFullySentNow(student) {
  return requiredTypesForLevel(student.level).every(t => isTypeSentInPeriod(student.id, t));
}

function showToast(msg) {
  const t = document.getElementById('toast');

}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── HOME ────────────────────────────────────────────────
let homeLevelTab = (() => { try { return localStorage.getItem('pr_home_level_tab') || 'all'; } catch { return 'all'; } })();

let homeGradeTab = 'all'; // 'all' | '1'〜'6' | 'none'

function selectHomeLevelTab(tab) {
  homeLevelTab = tab;
  homeGradeTab = 'all';
  try { localStorage.setItem('pr_home_level_tab', tab); } catch {}
  renderHome();
}

function selectHomeGradeTab(tab) {
  homeGradeTab = tab;
  renderHome();
}

function matchesGradeTab(s, tab) {
  if (tab === 'all')  return true;
  if (tab === 'none') return !s.grade;
  return String(s.grade) === tab;
}

// 学年区分タブを選んでいるときだけ、その下に学年タブを表示
function renderHomeGradeTabs(levelStudents) {
  const el = document.getElementById('home-grade-tabs');
  if (homeLevelTab === 'all') { el.hidden = true; return; }
  const n = GRADE_COUNT[homeLevelTab] || 0;
  const tabs = [{key:'all', label:'全学年'},
    ...Array.from({length: n}, (_, i) => ({key: String(i+1), label: `${LEVEL_SHORT[homeLevelTab]}${i+1}`}))];
  if (levelStudents.some(s => !s.grade)) tabs.push({key:'none', label:'未設定'});
  if (!tabs.some(t => t.key === homeGradeTab)) homeGradeTab = 'all';
  el.innerHTML = tabs.map(t => {
    const unsent = levelStudents.filter(s => matchesGradeTab(s, t.key) && !isFullySentNow(s)).length;
    return `<button class="grade-tab${t.key === homeGradeTab ? ' active' : ''}" onclick="selectHomeGradeTab('${t.key}')">${t.label}${unsent ? `<span class="gt-unsent">${unsent}</span>` : ''}</button>`;
  }).join('');
  el.hidden = false;
}

function renderHomeLevelTabs(allStudents) {
  const tabs = [{key:'all', label:'すべて'}, ...LEVELS.map(lv => ({key: lv, label: lv}))];
  document.getElementById('home-level-tabs').innerHTML = tabs.map(t => {
    const list = t.key === 'all' ? allStudents : allStudents.filter(s => s.level === t.key);
    const unsent = list.filter(s => !isFullySentNow(s)).length;
    const count = unsent
      ? `<span class="lt-count has-unsent" title="未送信 ${unsent}人">${unsent}</span>`
      : `<span class="lt-count">${list.length ? '✓' : 0}</span>`;
    return `<button class="level-tab${t.key === homeLevelTab ? ' active' : ''}" onclick="selectHomeLevelTab('${t.key}')">${t.label}${count}</button>`;
  }).join('');
}

// 今週の進み具合（通常授業の報告・全生徒）
function renderWeekPanel(allStudents) {
  const el = document.getElementById('home-week-panel');
  if (!allStudents.length) { el.hidden = true; return; }
  el.hidden = false;
  const sent = allStudents.filter(s => isClassSentThisWeek(s.id)).length;
  const left = allStudents.length - sent;
  const pct = Math.round(sent / allStudents.length * 100);
  el.innerHTML = `
    <div class="week-head">
      <div class="week-title">今週の進み具合（${weekRangeLabel()}）</div>
      <div class="week-nums">送信済 <b class="g">${sent}</b>人 ／ 残り <b class="${left ? 'r' : 'g'}">${left}</b>人</div>
    </div>
    <div class="week-bar"><div class="week-bar-fill" style="width:${pct}%"></div></div>
    <div class="week-actions">${weekActionsHtml()}</div>`;
}

// ホームの「今週」ボタン（まとめて作る・確認・送信）
function weekActionsHtml() {
  return `<button class="btn btn-blue" onclick="openBatch()">📦 まとめて作る</button>`;
}

function renderHome() {
  const allStudents = getStudents();
  const d = new Date();
  document.getElementById('home-month-label').textContent =
    `通常授業は今週（${weekRangeLabel()}）、テストの報告は${d.getMonth()+1}月の連絡状況`;
  renderWeekPanel(allStudents);

  if (homeLevelTab !== 'all' && !LEVELS.includes(homeLevelTab)) homeLevelTab = 'all';
  renderHomeLevelTabs(allStudents);
  const levelStudents = homeLevelTab === 'all' ? allStudents : allStudents.filter(s => s.level === homeLevelTab);
  renderHomeGradeTabs(levelStudents);
  const students = levelStudents.filter(s => matchesGradeTab(s, homeGradeTab));

  const sentCount = students.filter(s => isFullySentNow(s)).length;
  document.getElementById('stat-total').textContent  = students.length;
  document.getElementById('stat-total-label').textContent =
    homeLevelTab === 'all' ? '全生徒'
    : homeGradeTab === 'all' ? homeLevelTab
    : homeGradeTab === 'none' ? '学年未設定'
    : `${LEVEL_SHORT[homeLevelTab]}${homeGradeTab}`;
  document.getElementById('stat-sent').textContent   = sentCount;
  document.getElementById('stat-unsent').textContent = students.length - sentCount;

  const el = document.getElementById('home-student-list');
  if (!allStudents.length) {
    el.innerHTML = `<div class="empty"><div class="big">👥</div><p>まだ生徒が登録されていません。<br>設定 → 生徒管理から追加してください。</p></div>`;
    return;
  }
  if (!students.length) {
    el.innerHTML = `<div class="empty"><div class="big">👥</div><p>${esc(document.getElementById('stat-total-label').textContent)}の生徒はまだ登録されていません。</p></div>`;
    return;
  }

  const q = homeSearchQuery.trim().toLowerCase();
  const filtered = q
    ? students.filter(s => (s.name||'').toLowerCase().includes(q) || (s.parentName||'').toLowerCase().includes(q))
    : students;

  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="big">🔍</div><p>「${esc(homeSearchQuery)}」に一致する生徒がいません。</p></div>`;
    return;
  }

  // 今週まだ通常授業の報告を送っていない生徒を上に。その中では前回から日が空いている順
  const sorted = [...filtered].sort((a,b) => {
    const as = isClassSentThisWeek(a.id), bs = isClassSentThisWeek(b.id);
    if (as !== bs) return as ? 1 : -1;
    if (!as) {
      const ad = daysSinceClassSent(a.id), bd = daysSinceClassSent(b.id);
      const av = ad === null ? Infinity : ad, bv = bd === null ? Infinity : bd;
      if (av !== bv) return bv - av;
    }
    return compareStudents(a, b);
  });

  el.innerHTML = sorted.map(s => {
    const types = typesForLevel(s.level);
    const weekSent = isClassSentThisWeek(s.id);
    const statusHtml = types.length > 1
      ? types.map(t => typeStatusBadge(s.id, t, true)).join('')
      : typeStatusBadge(s.id, 'class', false);
    return `<div class="student-card" onclick="startCreate('${s.id}')">
      <div class="sc-bar ${weekSent?'sent':'unsent'}"></div>
      <div class="sc-info">
        <div class="sc-name">${esc(s.name)}</div>
        <div class="sc-meta">${esc(s.parentName||'—')}</div>
        <div class="sc-badges">
          <span class="badge badge-${s.level}">${gradeLabel(s)}</span>
          ${statusHtml}
          ${daysSinceLabel(s.id)}
        </div>
      </div>
      <button class="karte-btn" onclick="event.stopPropagation();openKarte('${s.id}')">📒 カルテ</button>
      <div class="sc-arrow">›</div>
    </div>`;
  }).join('');
}

function startCreateForm(studentId, reportType) {

  selectedEval   = null;

    ? `<span class="badge badge-type-${reportType}">${REPORT_TYPE_LABEL[reportType]}</span>`
    : '';
  document.getElementById('create-slevel').innerHTML =
    `<span class="badge badge-${s.level}">${gradeLabel(s)}</span> ${typeBadge}`;

  document.getElementById('video-url-input').value = '';
  document.getElementById('video-status').textContent = '';

  const noteInput  = document.getElementById('note-input');
  if (reportType === 'test') {
    step3Label.textContent = 'Step 3 · 詳細メモ（音声の文字起こしなど、そのまま貼り付け可）';
    noteInput.rows = 8;
    noteInput.placeholder = '例: (音声を文字起こしした内容をそのまま貼り付け)\n今日は数学のテスト振り返りをしました。点数は78点で目標の80点にわずかに届きませんでした。計算ミスが2問あり…';
  } else if (reportType === 'pretest') {
    step3Label.textContent = 'Step 3 · 詳細メモ（テスト日程・範囲・目標点・準備状況など）';
    noteInput.rows = 8;
    noteInput.placeholder = '例: 10/15から中間テスト。数学は方程式〜関数が範囲。目標は80点。\nワークは8割終わっている。関数の文章題が苦手なので残りの授業で重点的に演習予定。家では毎日30分ワークの見直しを…';
  } else {
    step3Label.textContent = 'Step 3 · 一言メモ（教科・様子など）';
    noteInput.rows = 3;
    noteInput.placeholder = '例: 今日は数学、集中して取り組んでいた。発言も多かった。\n例: 英語の小テストで満点だった。';
  }

  // Render evaluation buttons
  document.getElementById('eval-grid').innerHTML = EVALS.map((e,i) =>
    `<button class="eval-btn" id="eval-${i}" onclick="selectEval(${i})">
      <span class="e-emoji">${e.emoji}</span>
      <span class="e-label">${e.label}</span>
    </button>`
  ).join('');

  // Render chips for this school level & report type
  const chips = getChipsFor(s.level, reportType);
  document.getElementById('chip-wrap').innerHTML = chips.map(c =>
    `<div class="chip" data-chip="${esc(c)}" onclick="toggleChip(this)">${esc(c)}</div>`
  ).join('');

  // Render length options

// ─── VOICE INPUT (録音 → Whisper APIで文字起こし) ───────────
let mediaRecorder = null;
let audioChunks   = [];

function supportsRecording() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}

// 録音結果の書き込み先。既定は作成画面のメモ欄（まとめて作る画面では生徒ごとに切り替える）
const DEFAULT_MIC_TARGET = {
  btnId: 'mic-btn',
  apply(text) {
    const ta = document.getElementById('note-input');
    const base = ta.value && !ta.value.endsWith('\n') ? ta.value + '\n' : ta.value;
    ta.value = base + text;
  }
};
let micTarget = DEFAULT_MIC_TARGET;

function toggleMic(target) {
  if (!supportsRecording()) { showToast('このブラウザは音声入力に対応していません'); return; }
  if (micActive) { stopMic(); return; }
  micTarget = target || DEFAULT_MIC_TARGET;
  startMic();
}

async function startMic() {
  if (!getOpenAIKey()) { showToast('設定でOpenAI APIキーを登録してください'); showTab('settings'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    const mimeType = ['audio/mp4', 'audio/webm', 'audio/ogg'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    mediaRecorder = mimeType ? new MediaRecorder(stream, {mimeType}) : new MediaRecorder(stream);
    audioChunks = [];
    mediaRecorder.ondataavailable = (e) => { if (e.data.size) audioChunks.push(e.data); };
    const target = micTarget;
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      transcribeAudio(new Blob(audioChunks, {type: mediaRecorder.mimeType || 'audio/webm'}), target);
    };
    mediaRecorder.start();
    micActive = true;
    const btn = document.getElementById(target.btnId);
    if (btn) btn.classList.add('recording');
  } catch (e) {
    showToast('マイクの使用が許可されていません');
  }
}

function stopMic() {
  micActive = false;
  const btn = document.getElementById(micTarget.btnId);
  if (btn) btn.classList.remove('recording');
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

async function transcribeAudio(blob, target) {
  target = target || DEFAULT_MIC_TARGET;
  const btn = document.getElementById(target.btnId);
  if (btn) btn.disabled = true;
  showToast('文字起こし中...');
  try {
    const ext = blob.type.includes('mp4') ? 'mp4' : blob.type.includes('ogg') ? 'ogg' : 'webm';
    const form = new FormData();
    form.append('file', blob, `audio.${ext}`);
    form.append('model', 'whisper-1');
    form.append('language', 'ja');
    const resp = await fetch('https://api.openai.com/v1/audio/transcriptions', {
      method: 'POST',
      headers: {'Authorization': `Bearer ${getOpenAIKey()}`},
      body: form
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTPエラー ${resp.status}`);
    }
    const data = await resp.json();
    target.apply(data.text || '');
    showToast('文字起こし完了');
  } catch (e) {
    showToast('文字起こしエラー: ' + (e.message || '失敗しました'));
  } finally {
    if (btn) btn.disabled = false;
  }
}

// ─── 動画URL → 文字起こし（Supadata API）────────────────
const SUPADATA_BASE = 'https://api.supadata.ai/v1/transcript';
let videoBusy = false;

function isVideoUrl(u) {
  try { const x = new URL(u); return x.protocol === 'https:' || x.protocol === 'http:'; }
  catch { return false; }
}

async function supadataFetch(url) {
  let resp;
  try {
    resp = await fetch(url, {headers: {'x-api-key': getSupadataKey()}});
  } catch (e) {
    throw new Error('文字起こしサービスに接続できませんでした（通信エラー）');
  }
  const data = await resp.json().catch(() => ({}));
  return {status: resp.status, data};
}

// mode: 'native'=YouTubeの字幕を使う / 'generate'=AIで音声から文字起こし
async function fetchVideoTranscript(videoUrl, mode, onProgress) {
  const q = new URLSearchParams({url: videoUrl, lang: 'ja', text: 'true', mode});
  let {status, data} = await supadataFetch(`${SUPADATA_BASE}?${q}`);
  if (status === 202 && data.jobId) {
    const started = Date.now();
    while (true) {
      if (Date.now() - started > 15 * 60 * 1000) throw new Error('文字起こしが15分以内に終わりませんでした');
      await new Promise(r => setTimeout(r, 4000));
      onProgress && onProgress(Math.round((Date.now() - started) / 1000));
      const r = await supadataFetch(`${SUPADATA_BASE}/${encodeURIComponent(data.jobId)}`);
      if (r.status >= 400) { status = r.status; data = r.data; break; }
      if (r.data.status === 'completed') { status = 200; data = r.data; break; }
      if (r.data.status === 'failed') {
        const err = new Error(r.data.error || '文字起こしに失敗しました');
        throw err;
      }
    }
  }
  if (status === 401 || status === 403) throw new Error('Supadata APIキーが正しくありません（設定で確認してください）');
  if (status === 429) throw new Error('今月の無料枠（クレジット）を使い切りました');
  if (status >= 400) {
    const err = new Error(data.message || data.error || `HTTPエラー ${status}`);
    err.noTranscript = (status === 404 || status === 206 || /transcript|caption|字幕/i.test(JSON.stringify(data)));
    throw err;
  }
  const content = Array.isArray(data.content) ? data.content.map(c => c.text).join(' ') : (data.content || '');
  if (!content.trim()) { const err = new Error('字幕が見つかりませんでした'); err.noTranscript = true; throw err; }
  return content.trim();
}

async function onVideoTranscribe() {
  if (videoBusy) return;
  const input  = document.getElementById('video-url-input');
  const status = document.getElementById('video-status');
  const btn    = document.getElementById('video-btn');
  const videoUrl = input.value.trim();
  if (!isVideoUrl(videoUrl)) { showToast('動画のURLを貼り付けてください'); return; }
  if (!getSupadataKey()) { showToast('設定で動画文字起こし用のAPIキーを登録してください'); showTab('settings'); return; }

  videoBusy = true; btn.disabled = true;
  const setStatus = t => { status.textContent = t; };
  let text = '';
  try {
    setStatus('⏳ 動画の字幕を取得中...');
    try {
      text = await fetchVideoTranscript(videoUrl, 'native');
    } catch (e) {
      if (!e.noTranscript) throw e;
      const ok = confirm('この動画には字幕がまだありません。\nAIで音声から文字起こししますか？\n（動画1分あたり2クレジット消費。30分の動画で約60クレジット）');
      if (!ok) { setStatus('字幕がないため中止しました。YouTubeの自動字幕ができてから、もう一度試せます。'); return; }
      setStatus('⏳ AIで文字起こし中...（動画の長さによって数分かかります）');
      text = await fetchVideoTranscript(videoUrl, 'generate',
        sec => setStatus(`⏳ AIで文字起こし中... ${Math.floor(sec/60)}分${sec%60}秒経過`));
    }
    const ta = document.getElementById('note-input');
    const base = ta.value && !ta.value.endsWith('\n') ? ta.value + '\n' : ta.value;
    ta.value = base + text;
    if (ta.rows < 8) ta.rows = 8;
    setStatus(`✅ 文字起こし完了（${text.length}文字）。内容を確認して「AI生成」を押してください。`);
    showToast('文字起こし完了');
  } catch (e) {
    setStatus('⚠️ ' + (e.message || '文字起こしに失敗しました'));
  } finally {
    videoBusy = false; btn.disabled = false;
  }
}

// ─── CLAUDE API 共通 ──────────────────────────────────────
// effort: 'low'（抽出・分類など単純な処理）/ 'medium'（文章作成・チェック）
// 文章の長さはプロンプトで指定する。思考分も max_tokens に含まれるので上限は広めにとる
async function callClaude(system, user, effort) {
  const body = JSON.stringify({
    model: CLAUDE_MODEL,
    max_tokens: 16000,
    output_config: {effort: effort || 'medium'},
    fallbacks: 'default',
    system,
    messages: [{role: 'user', content: user}]
  });
  for (let attempt = 0; ; attempt++) {
    let resp;
    try {
      resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': getApiKey(),
          'anthropic-version': '2023-06-01',
          'anthropic-beta': 'server-side-fallback-2026-07-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body
      });
    } catch (e) {
      if (attempt < 3) { await sleep(2000 * 2 ** attempt); continue; }
      throw new Error('AIに接続できませんでした（通信エラー）');
    }
    // 混雑・レート制限・一時的なエラーは待ってから再試行
    if ((resp.status === 429 || resp.status >= 500) && attempt < 3) {
      const ra = Number(resp.headers.get('retry-after'));
      await sleep(ra > 0 ? ra * 1000 : 3000 * 2 ** attempt);
      continue;
    }
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      const msg = err.error?.message || `HTTPエラー ${resp.status}`;
      throw new Error(resp.status === 429 ? `混雑のため実行できませんでした（${msg}）` : msg);
    }
    const data = await resp.json();
    if (data.stop_reason === 'refusal') throw new Error('AIが生成を断りました。メモの内容を見直してください');
    if (data.stop_reason === 'max_tokens') throw new Error('文章が長すぎて途中で切れました。もう一度試してください');
    return (data.content || []).filter(c => c.type === 'text').map(c => c.text).join('').trim();
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

const lastRevised = {report: '', blog: ''};

function nameParts(student) {
  const parts = [];
  [student.name, student.parentName].forEach(n => {
    if (!n) return;
    const t = n.trim();
    parts.push(t.replace(/\s+/g, ''));
    t.split(/[\s　]+/).forEach(p => { if (p.length >= 2) parts.push(p); });
  });
  return [...new Set(parts)];
}

  });
  if (kind === 'blog') {
    nameParts(student).forEach(p => {
      if (text.includes(p)) issues.push({level: '要修正', quote: p, reason: '公開記事に生徒・保護者の名前が含まれています', suggestion: '名前を削除してください'});
    });
  }
  return issues;
}

async function aiCheck(kind, text, student, note) {
  const common = `指摘は本当に直すべきものだけに絞り、問題がなければ issues を空にしてください。
出力は次のJSONのみ（コードブロック・前置きなし）:
{"issues":[{"level":"要修正"または"注意","quote":"問題箇所の原文そのまま（短く）","reason":"理由","suggestion":"修正案"}],"revised":"指摘をすべて反映した全文（問題がなければ空文字）"}`;
  const system = kind === 'report'
    ? `あなたは塾から保護者へ送る連絡文の最終チェック担当です。次の観点で文章をチェックしてください。
- 保護者を不安にさせる・責めていると受け取られる表現、生徒を否定・断定的に批判する表現
- 他の生徒の名前や、他の生徒との比較
- 指導メモにない事実の捏造、メモとの食い違い（点数・教科・日付など）
- 生徒名・保護者名の誤り（正しくは 生徒「${student.name}」保護者「${student.parentName || '未登録'}」）
- 敬語の誤り、誤字脱字、不自然な日本語
- 塾内部の事情など保護者に送るべきでない内容
${common}`
    : `あなたは塾のホームページに公開するブログ記事の最終チェック担当です。次の観点で文章をチェックしてください。
- 個人が特定できる情報（生徒名・あだ名・イニシャル・保護者名・学校名・部活チーム名・地名など）。この生徒の本名は「${student.name}」、保護者は「${student.parentName || '未登録'}」
- 生徒の課題・欠席・体調・成績不振などネガティブな内容
- 他の生徒・学校・他塾を下げる表現、誇大広告や合格保証と受け取られる表現
- 指導メモにない事実の捏造
- 誤字脱字、不自然な日本語
${common}`;
  const user = `【チェック対象】\n${text}\n\n【参考：指導メモ・文字起こし】\n${note || '（なし）'}`;
  const raw = await callClaude(system, user, 'medium');
  const m = raw.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('チェック結果を読み取れませんでした');
  const parsed = JSON.parse(m[0]);
  return {issues: Array.isArray(parsed.issues) ? parsed.issues : [], revised: parsed.revised || ''};
}

// 画面に依存しないネガチェック本体。{issues, revised, aiError} を返す（失敗しても例外にしない）
async function checkText(kind, text, student, note) {
  const local = localCheck(kind, text, student);
  let ai = {issues: [], revised: ''};
  let aiError = '';
  try { ai = await aiCheck(kind, text, student, note); }
  catch (e) { aiError = e.message || 'チェックに失敗しました'; }
  return {issues: [...local, ...ai.issues], revised: ai.revised, aiError};
}

function checkHasMust(result) {
  return !!result && (result.issues || []).some(i => i.level === '要修正');
}

function checkBoxClass(result) {
  const issues = result.issues || [];
  if (result.aiError) return 'check-box warn';
  return 'check-box ' + (!issues.length ? 'ok' : checkHasMust(result) ? 'bad' : 'warn');
}

const CHECK_TITLE = {report: '報告文', blog: 'ブログ記事', reply: '返信文'};

function checkBoxInner(kind, result) {
  const issues = result.issues || [];
  const title = CHECK_TITLE[kind] || '文章';
  const head = result.aiError
    ? `⚠️ AIチェックに失敗しました（${esc(result.aiError)}）。目視で確認してください`
    : !issues.length ? `✅ ${title}：ネガチェックOK` : `🛡️ ${title}：${issues.length}件の指摘`;
  return `<div class="check-head">${head}</div>` +
    issues.map(i => `
      <div class="check-issue">
        <span class="check-tag${i.level === '要修正' ? ' must' : ''}">${esc(i.level || '注意')}</span>
        <span class="check-quote">「${esc(i.quote || '')}」</span>
        <div>${esc(i.reason || '')}</div>
        ${i.suggestion ? `<div class="check-sugg">→ ${esc(i.suggestion)}</div>` : ''}
      </div>`).join('');
}

// ─── 生徒カルテ ───────────────────────────────────────────
const NOTE_CATS = ['好きなこと', '雑談', '家庭・部活', '学習', 'その他'];
let karteStudentId = null;
let karteReturn    = 'home';
let karteCat       = '好きなこと';
let karteCands     = [];   // 文字起こしから抽出したカルテ候補

function notesFor(studentId) { return notesCache.filter(n => n.studentId === studentId); }
function reportsFor(studentId) { return getReports().filter(r => r.studentId === studentId); }

function fmtYMD(iso) {

function openKarte(studentId) {

// 報告文生成に渡すカルテ情報
function karteContext(student) {
  const notes = notesFor(student.id).slice(0, 15);
  const reports = reportsFor(student.id).slice(0, 2);
  if (!notes.length && !reports.length) return '';
  let out = '';
  if (notes.length) {
    out += '好きなこと・雑談メモ:\n' + notes.map(n => `- [${n.category}] ${n.text}（${fmtYMD(n.createdAt)}）`).join('\n');
  }
  if (reports.length) {
    out += (out ? '\n\n' : '') + '直近の報告:\n' + reports.map(r =>
      `- ${fmtYMD(r.sentAt)}（${REPORT_TYPE_LABEL[r.reportType || 'class']}）: ${(r.body || '').replace(/\s+/g, ' ').slice(0, 300)}`).join('\n');
  }
  return out;
}

// 文字起こしからカルテ候補を抽出
async function extractKarteCands(student, note, seq) {
  const box = document.getElementById('karte-cand');
  karteCands = [];
  if (!note || note.length < 20) { box.hidden = true; return; }
  box.hidden = false;
  box.className = 'check-box karte-box loading';
  box.textContent = '📒 文字起こしからカルテに残す話題を探しています...';
  try {
    const cands = await fetchKarteCands(student, note);
    if (seq !== genSeq) return;
    karteCands = cands;
  } catch (e) {
    if (seq !== genSeq) return;
    box.className = 'check-box warn';
    box.textContent = 'カルテ候補の抽出に失敗しました: ' + (e.message || '');
    return;
  }
  renderKarteCands();
}

// 画面に依存しないカルテ候補の抽出本体。[{category, text, checked, saved}] を返す
async function fetchKarteCands(student, note) {
  if (!note || note.length < 20) return [];
  const existing = notesFor(student.id).slice(0, 30).map(n => `- ${n.text}`).join('\n') || '（なし）';
  const system = `あなたは塾講師のアシスタントです。指導中の会話の文字起こしから、この生徒について今後の会話や報告に役立つ情報を抜き出して「生徒カルテ」に残します。
抜き出す対象:
- 好きなこと（趣味・推し・好きな教科・ハマっているもの・将来の夢など）
- 雑談の話題（最近の出来事・楽しみにしていること・話して盛り上がったこと）
- 家庭・部活（部活の様子・大会・習い事・家族とのイベントなど、本人が話した範囲）
- 学習（苦手・得意の傾向、効果のあった勉強法など、次回以降も参考になること）
ルール:
- 1件は1行の短い文。文字起こしに出てきた事実だけを書き、推測しない。
- 体調・病気・家庭の事情・人間関係のトラブルなどデリケートな内容は抜き出さない。
- 既存メモと同じ内容は出さない。
- 該当がなければ空配列。最大6件。
出力は次のJSONのみ（コードブロック・前置きなし）:
{"notes":[{"category":"好きなこと|雑談|家庭・部活|学習","text":"..."}]}`;
  const user = `生徒: ${student.name}（${gradeLabel(student)}）\n\n【既存のカルテメモ】\n${existing}\n\n【今回の文字起こし】\n${note}`;
  const raw = await callClaude(system, user, 'low');
  const m = raw.match(/\{[\s\S]*\}/);
  const parsed = m ? JSON.parse(m[0]) : {notes: []};
  return (parsed.notes || []).filter(n => n && n.text).map(n => ({
    category: NOTE_CATS.includes(n.category) ? n.category : 'その他',
    text: String(n.text).trim(), checked: true, saved: false
  }));
}

function renderKarteCands() {
  const box = document.getElementById('karte-cand');
  if (!karteCands.length) {
    box.className = 'check-box karte-box';
    box.innerHTML = '<div class="check-head">📒 今回はカルテに残す新しい話題はありませんでした</div>';
    return;
  }
  const allSaved = karteCands.every(c => c.saved || !c.checked);
  box.className = 'check-box karte-box';
  box.innerHTML = `<div class="check-head">📒 カルテに残す候補（${karteCands.length}件）</div>` +
    karteCands.map((c, i) => `
      <label class="cand-item">
        <input type="checkbox" ${c.checked ? 'checked' : ''} ${c.saved ? 'disabled' : ''} onchange="karteCands[${i}].checked=this.checked;renderKarteCands()">
        <span><span class="note-cat c-${esc(c.category)}">${esc(c.category)}</span> ${esc(c.text)}${c.saved ? ' <b style="color:var(--green);">✓保存済</b>' : ''}</span>
      </label>`).join('') +
    `<div class="check-actions">
      <button class="btn btn-green" onclick="saveKarteCands()" ${allSaved ? 'disabled' : ''}>📒 選んだものをカルテに保存</button>
    </div>
    <div class="settings-hint">「送信済みにする」を押したときも、チェックが入っているものは自動で保存されます。</div>`;
}

async function saveKarteCands(silent) {
  const student = currentStudent;
  if (!student) return;
  const targets = karteCands.filter(c => c.checked && !c.saved);
  if (!targets.length) return;
  for (const c of targets) {
    await saveNote(student.id, c.category, c.text, 'auto');
    c.saved = true;
  }
  renderKarteCands();
  if (!silent) showToast(`カルテに${targets.length}件保存しました`);
}

// strictMaterial: まとめて生成用。今回の素材にない出来事をカルテや過去の報告から作らせない
async function generateReport(student, reportType, evalType, chips, note, length, strictMaterial) {
  const apiKey = getApiKey();
  const styles = getStyles();
  const samples = ((styles[student.level] || {})[reportType] || []).map(sp => sp.text).filter(Boolean);
  const styleSample = samples.join('\n\n---\n\n');
  const typeLabel = REPORT_TYPE_LABEL[reportType];
  const lengthOpt = LENGTH_OPTIONS.find(o => o.key === length) || LENGTH_OPTIONS[1];

  const extraInstruction = {
    test:    '追加メモには音声を文字起こししたテキストがそのまま含まれる場合があります。その中から教科名・点数・目標との比較・本人の様子など重要な情報を抽出し、簡潔で分かりやすい報告文にまとめてください。',
    pretest: 'これはテスト前の報告です。まだテスト結果は出ていないので、結果や点数を書かないでください。追加メモには音声を文字起こししたテキストがそのまま含まれる場合があります。その中からテストの日程・範囲・目標点・今の準備状況・テストまでの学習計画など重要な情報を抽出してください。必要であれば、ご家庭で声かけやサポートをお願いする一文も入れてください。'
  }[reportType] || '';

  const systemPrompt = (styleSample
    ? `あなたは保護者への連絡文を書くアシスタントです。以下の例文を参考に、同じ文体・口調・言い回しで連絡文を生成してください。出力は連絡文のみ（前置き・説明なし）。\n\n【文体サンプル（${student.level}・${typeLabel}）】\n${styleSample}`
    : 'あなたは保護者への連絡文を書くアシスタントです。丁寧で温かみのある文体で連絡文を生成してください。出力は連絡文のみ（前置き・説明なし）。'
  ) + (extraInstruction ? `\n\n${extraInstruction}` : '')
    + `\n\n「生徒カルテ」が渡された場合は参考情報として使ってください。前回の報告からの変化に触れたり、好きなことの話題に自然に一言触れたりする程度にとどめ、無理に使ったりメモを羅列したりしないでください。今回のメモと矛盾する場合は今回のメモを優先してください。`
    + (strictMaterial ? `\n\n今回の授業の出来事（教科・内容・点数・様子）は「追加メモ」に書かれていることだけを書いてください。追加メモにない出来事を、生徒カルテや過去の報告から推測して書かないでください。` : '')
    + `\n\n文章の長さ: ${lengthOpt.desc}`;
  const karte = karteContext(student);

  const chipsText = chips.length ? chips.join('、') : '（特になし）';
  const userPrompt = `以下の情報で保護者への連絡文を生成してください。

生徒名: ${student.name}
保護者: ${student.parentName ? student.parentName + '様' : '保護者様'}
学年区分: ${student.level}${student.grade ? `（${student.grade}年生）` : ''}
報告種別: ${typeLabel}
全体評価: ${evalType}
具体的なポイント: ${chipsText}
追加メモ: ${note || '（なし）'}
${karte ? `\n【生徒カルテ（参考）】\n${karte}\n` : ''}
連絡文のみ出力してください。`;

  return callClaude(systemPrompt, userPrompt, 'medium');
}

// ─── まとめて作る（今週の通常授業）──────────────────────────
// 下書きは users/{uid}/drafts/{週キー}_{生徒ID}。素材・生成結果・確認状態・送信状態を持つ
const DRAFT_STATUS_LABEL = {queued:'待機中', transcribing:'文字起こし中', generating:'生成中', checking:'チェック中', done:'完了', failed:'失敗', interrupted:'中断'};
const RUNNING_STATUSES = ['queued', 'transcribing', 'generating', 'checking'];
const BATCH_CONCURRENCY = 3;
const MATERIAL_KINDS = [
  {key:'text',  label:'📝 メモ'},
  {key:'voice', label:'🎤 音声'},
  {key:'video', label:'🎬 動画'},
];
let batchRunning    = new Set(); // この画面で処理中の下書きID
let batchMaterials  = {};        // studentId -> 入力中の素材 {kind, text, videoUrl}
let batchSaveTimers = {};
let batchSavePending = {};
let batchListKey    = '';
let batchLength = (() => { try { return localStorage.getItem('pr_batch_length') || 'normal'; } catch { return 'normal'; } })();

function draftId(studentId) { return `${currentWeekKey()}_${studentId}`; }
function draftOf(studentId) { return draftsCache.find(d => d.id === draftId(studentId)); }

function saveDraft(id, obj) {
  const local = draftsCache.find(d => d.id === id);
  if (local) Object.assign(local, obj); else draftsCache.push({id, ...obj});
  const { db, doc, setDoc } = window.fb;
  return setDoc(doc(db, 'users', fbUser.uid, 'drafts', id), {...obj, updatedAt: new Date().toISOString()}, {merge: true});
}

// 前の画面を閉じても処理中のままになっている下書きは「中断」として扱う
function draftStatus(d) {
  if (!d || !d.status) return '';
  if (RUNNING_STATUSES.includes(d.status) && !batchRunning.has(d.id)) return 'interrupted';
  return d.status;
}

function materialOf(studentId) {
  if (batchMaterials[studentId]) return batchMaterials[studentId];
  const d = draftOf(studentId);
  return {kind: 'text', text: '', videoUrl: '', ...((d && d.material) || {})};
}

function hasMaterial(m) {
  return m.kind === 'video' ? isVideoUrl((m.videoUrl || '').trim()) : !!(m.text || '').trim();
}

// 今週まだ通常授業の報告を送っていない生徒（ホームと同じ並び）
function batchStudents() {
  return getStudents().filter(s => !isClassSentThisWeek(s.id)).sort((a, b) => {
    const ad = daysSinceClassSent(a.id), bd = daysSinceClassSent(b.id);
    const av = ad === null ? Infinity : ad, bv = bd === null ? Infinity : bd;
    return (bv - av) || compareStudents(a, b);
  });
}

function batchNeedsRun(studentId) {
  const st = draftStatus(draftOf(studentId));
  return !st || st === 'failed' || st === 'interrupted';
}

let batchMaterialsWeek = '';

function openBatch() {
  if (batchMaterialsWeek !== currentWeekKey()) { batchMaterials = {}; batchMaterialsWeek = currentWeekKey(); }
  hideAllScreens();
  document.getElementById('screen-batch').classList.add('active');
  renderBatch();
  window.scrollTo(0, 0);
}

function renderBatch() {

function renderBatchMaterial(sid) {
  const m = materialOf(sid);
  document.getElementById('bkinds-' + sid).innerHTML = MATERIAL_KINDS.map(k =>
    `<div class="chip${k.key === m.kind ? ' sel' : ''}" onclick="setBatchKind('${sid}','${k.key}')">${k.label}</div>`).join('');
  const box = document.getElementById('bmat-' + sid);
  if (m.kind === 'video') {
    box.innerHTML = `<input class="settings-input" type="url" inputmode="url" placeholder="🎬 動画のURL（YouTube）を貼り付け" value="${esc(m.videoUrl)}" oninput="onBatchInput('${sid}','videoUrl',this.value)">`;
  } else {
    const mic = m.kind === 'voice'
      ? `<button type="button" class="mic-btn" id="bmic-${sid}" onclick="toggleMic(batchMicTarget('${sid}'))" title="録音して文字にする">🎤</button>` : '';
    const ph = m.kind === 'voice' ? '🎤を押して話す → もう一度押すと文字になります（直接入力・修正も可）' : '例: 数学の方程式。計算が速くなってきた。部活の大会の話をしていた。';
    box.innerHTML = `<div class="note-row"><textarea class="note-input" id="btext-${sid}" rows="2" placeholder="${ph}" oninput="onBatchInput('${sid}','text',this.value)">${esc(m.text)}</textarea>${mic}</div>`;
  }

  return {

      batchMaterials[sid] = m;
      const ta = document.getElementById('btext-' + sid);
      if (ta) ta.value = m.text;

      updateBatchRow(sid);

function onBatchInput(sid, field, value) {

function scheduleSaveMaterial(sid, delay) {
  clearTimeout(batchSaveTimers[sid]);
  batchSavePending[sid] = true;
  batchSaveTimers[sid] = setTimeout(() => saveMaterialNow(sid), delay);
}

function saveMaterialNow(sid) {
  clearTimeout(batchSaveTimers[sid]);
  if (!batchSavePending[sid]) return Promise.resolve();
  delete batchSavePending[sid];
  const m = materialOf(sid);
  return saveDraft(draftId(sid), {
    studentId: sid, weekKey: currentWeekKey(), reportType: 'class',
    material: {kind: m.kind, text: m.text || '', videoUrl: (m.videoUrl || '').trim()}
  });
}

function updateBatchRow(sid) {
  const statEl = document.getElementById('bstat-' + sid);
  const msgEl  = document.getElementById('bmsg-' + sid);
  if (!statEl) return;
  const d  = draftOf(sid);
  const st = draftStatus(d);
  const ready = hasMaterial(materialOf(sid));
  let cls = '', label = '', msg = '', err = false;
  if (st === 'done') {
    cls = 'done';
    label = d.sentAt ? '送信済' : d.review === 'ok' ? '確認済' : '完了';
    msg = d.sentAt ? '' : d.review === 'ok' ? '確認済み · 送信待ち' : '確認待ち';
    msg += ` <button class="btn btn-outline" onclick="retryBatch('${sid}')">🔁 素材から作り直す</button>`;
  } else if (st === 'failed' || st === 'interrupted') {
    cls = 'failed'; err = true;
    label = DRAFT_STATUS_LABEL[st];
    msg = '⚠️ ' + esc(st === 'interrupted' ? '前回の処理が途中で止まりました' : (d.error || '失敗しました')) +
      `<br><button class="btn btn-outline" onclick="retryBatch('${sid}')">🔁 再実行</button>` +
      (d.errorCode === 'nocaption' ? `<button class="btn btn-outline" onclick="retryBatch('${sid}', true)">🎙 AIで音声から文字起こしして再実行（クレジット消費）</button>` : '');
  } else if (st) {
    cls = 'run'; label = DRAFT_STATUS_LABEL[st];
  } else {
    cls = ready ? 'ready' : ''; label = ready ? '素材あり' : '素材なし';
  }
  statEl.className = 'bstat' + (cls ? ' ' + cls : '');
  statEl.textContent = label;
  msgEl.className = 'batch-msg' + (err ? ' err' : '');
  msgEl.innerHTML = msg;
}

function updateBatchSummary() {
  const students = batchStudents();
  const ready = students.filter(s => hasMaterial(materialOf(s.id)));
  const todo  = ready.filter(s => batchNeedsRun(s.id));
  const done  = students.filter(s => draftStatus(draftOf(s.id)) === 'done').length;
  const running = students.filter(s => batchRunning.has(draftId(s.id))).length;
  document.getElementById('batch-sub').textContent =
    `今週まだ ${students.length}人 · 素材あり ${ready.length}人 · 生成済 ${done}人`;
  const btn = document.getElementById('batch-run-btn');
  btn.disabled = !todo.length || running > 0;
  btn.textContent = running ? `⏳ 生成中…（残り ${running}人）`
    : todo.length ? `✨ 素材のある ${todo.length}人分をまとめて生成` : '✨ まとめて生成（素材を入れてください）';
}

// Firestore の更新が来たとき。入力中の欄は作り直さず、状態表示だけ更新する
function refreshBatch() {
  const key = batchStudents().map(s => s.id).join(',');
  const typing = document.activeElement && document.getElementById('batch-list').contains(document.activeElement);
  if (key !== batchListKey && !typing) { renderBatch(); return; }
  batchStudents().forEach(s => updateBatchRow(s.id));
  updateBatchSummary();
}

async function runBatch() {
  if (!getApiKey()) { showToast('設定でAPIキーを登録してください'); showTab('settings'); return; }
  const targets = batchStudents().filter(s => hasMaterial(materialOf(s.id)) && batchNeedsRun(s.id));
  if (!targets.length) { showToast('素材が入っている未生成の生徒がいません'); return; }
  if (targets.some(s => materialOf(s.id).kind === 'video') && !getSupadataKey()) {
    showToast('動画の文字起こし用APIキー（Supadata）を設定してください'); return;
  }
  await Promise.all(targets.map(s => { batchSavePending[s.id] = true; return saveMaterialNow(s.id); }));
  targets.forEach(s => {
    batchRunning.add(draftId(s.id));
    saveDraft(draftId(s.id), {status: 'queued', error: '', errorCode: ''});
  });
  refreshBatch();
  await runPool(targets, BATCH_CONCURRENCY, s => processDraft(s.id));
  const ds = targets.map(s => draftOf(s.id));
  const ok = ds.filter(d => d && d.status === 'done').length;
  showToast(`まとめて生成が終わりました（完了 ${ok}人${ok < ds.length ? `・失敗 ${ds.length - ok}人` : ''}）`);
}

async function retryBatch(sid, allowGenerate) {
  const id = draftId(sid);
  if (batchRunning.has(id)) return;
  if (!hasMaterial(materialOf(sid))) { showToast('素材を入れてください'); return; }
  if (allowGenerate && !confirm('AIで動画の音声から文字起こしします。\n（動画1分あたり2クレジット消費。30分の動画で約60クレジット）')) return;
  batchSavePending[sid] = true;
  await saveMaterialNow(sid);
  batchRunning.add(id);
  saveDraft(id, {status: 'queued', error: '', errorCode: ''});
  refreshBatch();
  await processDraft(sid, {allowGenerate});
}

// items を最大 n 件ずつ並行で処理する。1件の失敗はほかに影響しない（fn 側で例外を処理する）
async function runPool(items, n, fn) {
  let next = 0;
  const worker = async () => { while (next < items.length) await fn(items[next++]); };
  await Promise.all(Array.from({length: Math.min(n, items.length)}, worker));
}

// 1人分：文字起こし → 評価・ポイント選択 → 報告文 → ネガチェック・カルテ候補・ブログ（＋チェック）
async function processDraft(studentId, opts = {}) {
  const id = draftId(studentId);
  const set = obj => { const p = saveDraft(id, obj); if (document.getElementById('screen-batch').classList.contains('active')) refreshBatch(); return p; };
  batchRunning.add(id);
  try {
    const student = getStudents().find(x => x.id === studentId);
    if (!student) throw new Error('生徒が見つかりません');
    const mat = materialOf(studentId);
    let note = '';
    if (mat.kind === 'video') {
      const url = (mat.videoUrl || '').trim();
      const d = draftOf(studentId) || {};
      if (d.transcript && d.transcriptUrl === url) {
        note = d.transcript; // 再実行では文字起こしをやり直さない（クレジット節約）
      } else {
        await set({status: 'transcribing'});
        try {
          note = await fetchVideoTranscript(url, 'native');
        } catch (e) {
          if (!e.noTranscript) throw e;
          if (!opts.allowGenerate) {
            const err = new Error('この動画にはまだ字幕がありません。YouTubeの自動字幕ができてから再実行するか、AIで文字起こしできます');
            err.code = 'nocaption';
            throw err;
          }
          note = await fetchVideoTranscript(url, 'generate');
        }
        await set({transcript: note, transcriptUrl: url});
      }
    } else {
      note = (mat.text || '').trim();
    }
    // 素材がない生徒の報告は絶対に作らない（カルテだけから事実を作らせない）
    if (!note.trim()) throw new Error('素材が空のため生成しませんでした');

    await set({status: 'generating'});
    const picked = await pickEvalAndChips(student, note);
    const body = await generateReport(student, 'class', picked.evalLabel, picked.chips, note, batchLength, true);

    await set({status: 'checking'});
    const wantBlog = settingsCache.blogEnabled !== false;
    const [reportCheck, karte, blog] = await Promise.all([
      checkText('report', body, student, note),
      fetchKarteCands(student, note).then(c => ({cands: c, error: ''}), e => ({cands: [], error: e.message || '失敗しました'})),
      wantBlog
        ? generateBlog(student, body, note).then(
            async b => ({body: b, check: await checkText('blog', b, student, note), error: ''}),
            e => ({body: '', check: null, error: e.message || '失敗しました'}))
        : Promise.resolve({body: '', check: null, error: ''}),
    ]);
    await set({
      status: 'done', error: '', errorCode: '',
      note, evalLabel: picked.evalLabel, chips: picked.chips, length: batchLength,
      body, reportCheck,
      blogBody: blog.body, blogCheck: blog.check, blogError: blog.error, blogDone: false,
      karteCands: karte.cands.map(c => ({category: c.category, text: c.text, checked: true})), karteError: karte.error,
      review: 'pending', generatedAt: new Date().toISOString(),
    });
  } catch (e) {
    await set({status: 'failed', error: e.message || '失敗しました', errorCode: e.code || ''});
  } finally {
    batchRunning.delete(id);
    if (document.getElementById('screen-batch').classList.contains('active')) refreshBatch();
  }
}

// 素材から「全体評価」と「具体的なポイント」をAIに選ばせる（あとで確認画面で変えられる）
function evalLabelOf(e) { return `${e.emoji} ${e.label.replace('\n', '')}`; }

async function pickEvalAndChips(student, note) {
  const chips = getChipsFor(student.level, 'class');
  const evalLabels = EVALS.map(evalLabelOf);
  const system = `あなたは塾講師のアシスタントです。授業メモ・文字起こしを読み、保護者への報告に使う「全体評価」と「具体的なポイント」を候補から選びます。
ルール:
- 全体評価は候補から1つだけ選ぶ。判断できなければ「💬 その他」。
- 具体的なポイントは、メモに根拠があるものだけを候補から0〜4個選ぶ。根拠のない項目、特に欠席・遅刻・不安定などネガティブな項目は、メモにはっきり書かれていない限り選ばない。
- 候補の文言をそのまま使う。
出力は次のJSONのみ（コードブロック・前置きなし）:
{"eval":"全体評価の文言","chips":["..."]}`;
  const user = `【全体評価の候補】\n${evalLabels.join('\n')}\n\n【具体的なポイントの候補】\n${chips.join('\n')}\n\n【授業メモ・文字起こし】\n${note}`;
  const raw = await callClaude(system, user, 'low');
  let parsed = {};
  try { const m = raw.match(/\{[\s\S]*\}/); parsed = m ? JSON.parse(m[0]) : {}; } catch {}
  return {
    evalLabel: evalLabels.includes(parsed.eval) ? parsed.eval : evalLabels[evalLabels.length - 1],
    chips: (Array.isArray(parsed.chips) ? parsed.chips : []).filter(c => chips.includes(c)),
  };
}

function autoSaveOpenAIKey(input) {
  const val = input.value.trim();
  const { db, doc, setDoc } = window.fb;
  setDoc(doc(db, 'users', fbUser.uid, 'settings', 'main'), {openaiApiKey: val}, {merge: true});
  const label = input.closest('.settings-group').querySelector('label');
  if (label) {
    label.innerHTML = `OpenAI APIキー（音声入力用） ${val
      ? '<span class="api-ok set">✓ 設定済み</span>'
      : '<span class="api-ok none">未設定</span>'}`;
  }
  if (val) showToast('APIキーを保存しました');
}

function openAddStyleSample(level, type) {
  document.getElementById('mstyle-title').textContent = `${level}・${REPORT_TYPE_LABEL[type]}の文例を追加`;
  document.getElementById('msty-level').value = level;
  document.getElementById('msty-type').value  = type;
  document.getElementById('msty-id').value    = '';
  document.getElementById('msty-text').value  = '';
  openModal('modal-style');
}

function editStyleSample(level, type, id) {
  const styles = getStyles();
  const sample = ((styles[level] || {})[type] || []).find(x => x.id === id);
  if (!sample) return;
  document.getElementById('mstyle-title').textContent = `${level}・${REPORT_TYPE_LABEL[type]}の文例を編集`;
  document.getElementById('msty-level').value = level;
  document.getElementById('msty-type').value  = type;
  document.getElementById('msty-id').value    = id;
  document.getElementById('msty-text').value  = sample.text;
  openModal('modal-style');
}

async function saveStyleSample() {
  const text = document.getElementById('msty-text').value.trim();
  if (!text) { showToast('文例を入力してください'); return; }
  const level = document.getElementById('msty-level').value;
  const type  = document.getElementById('msty-type').value;
  const id    = document.getElementById('msty-id').value || uid();
  const { db, doc, setDoc } = window.fb;
  await setDoc(doc(db, 'users', fbUser.uid, 'styles', id), {level, type, text});
  closeModal('modal-style');
  showToast(document.getElementById('msty-id').value ? '更新しました' : '文例を追加しました');
}

async function deleteStyleSample(level, type, id) {
  if (!confirm('この文例を削除しますか？')) return;
  const { db, doc, deleteDoc } = window.fb;
  await deleteDoc(doc(db, 'users', fbUser.uid, 'styles', id));
  showToast('削除しました');
}

// ─── STUDENT CRUD ────────────────────────────────────────
function openAddStudent() {
  document.getElementById('mstudent-title').textContent = '生徒追加';
  document.getElementById('mst-id').value     = '';
  document.getElementById('mst-name').value   = '';
  document.getElementById('mst-parent').value = '';
  document.getElementById('mst-level').value  = '中学生';
  updateGradeOptions(null);
  document.getElementById('mst-note').value   = '';
  openModal('modal-student');
}

function updateGradeOptions(selected) {
  const level = document.getElementById('mst-level').value;
  const sel = document.getElementById('mst-grade');
  const keep = selected !== undefined ? selected : Number(sel.value) || null;
  const n = GRADE_COUNT[level] || 0;
  sel.innerHTML = `<option value="">未設定</option>` +
    Array.from({length: n}, (_, i) => `<option value="${i+1}">${LEVEL_SHORT[level]}${i+1}（${i+1}年生）</option>`).join('');
  sel.value = keep && keep <= n ? String(keep) : '';
}

function editStudent(id) {
  const s = getStudents().find(x => x.id === id);
  if (!s) return;
  document.getElementById('mstudent-title').textContent = '生徒編集';
  document.getElementById('mst-id').value     = id;
  document.getElementById('mst-name').value   = s.name;
  document.getElementById('mst-parent').value = s.parentName || '';
  document.getElementById('mst-level').value  = s.level;
  updateGradeOptions(s.grade || null);
  document.getElementById('mst-note').value   = s.note || '';
  openModal('modal-student');
}

async function saveStudent() {
  const name = document.getElementById('mst-name').value.trim();
  if (!name) { showToast('生徒名を入力してください'); return; }
  const id  = document.getElementById('mst-id').value || uid();
  const obj = {
    name,
    parentName: document.getElementById('mst-parent').value.trim(),
    level:      document.getElementById('mst-level').value,
    grade:      Number(document.getElementById('mst-grade').value) || null,
    note:     document.getElementById('mst-note').value.trim(),
  };
  const { db, doc, setDoc } = window.fb;
  await setDoc(doc(db, 'users', fbUser.uid, 'students', id), obj);
  closeModal('modal-student');
  showToast(document.getElementById('mst-id').value ? '更新しました' : '生徒を追加しました');
}

async function deleteStudent(id) {
  const s = getStudents().find(x => x.id === id);
  if (!s || !confirm(`「${s.name}」を削除しますか？`)) return;
  const { db, doc, deleteDoc } = window.fb;
  await deleteDoc(doc(db, 'users', fbUser.uid, 'students', id));
  showToast('削除しました');
}

// ─── CLOSE MODALS ON BACKDROP CLICK ─────────────────────
document.querySelectorAll('.modal-overlay').forEach(el =>
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); })
);
