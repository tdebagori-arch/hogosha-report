<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>保護者連絡</title>
<style>
:root {
  --blue:#2563EB; --blue-dk:#1D4ED8; --blue-l:#EFF6FF;
  --green:#10B981; --green-l:#ECFDF5;
  --red:#EF4444; --red-l:#FEF2F2;
  --purple:#7C3AED; --purple-l:#F5F3FF;
  --gray:#64748B; --gray-l:#F1F5F9; --gray-bd:#E2E8F0;
  --navy:#0F172A; --white:#FFFFFF;
  --r:12px; --r-sm:8px; --nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;background:var(--gray-l);color:var(--navy);min-height:100dvh;padding-bottom:var(--nav-h);}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--white);border-top:1px solid var(--gray-bd);display:flex;z-index:100;}
.nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--gray);border:none;background:none;font-size:10px;font-weight:600;transition:color 0.15s;}
.nav-tab .ni{font-size:22px;line-height:1;}
.nav-tab.active{color:var(--blue);}

/* SCREENS */
.screen{display:none;flex-direction:column;min-height:calc(100dvh - var(--nav-h));}
.screen.active{display:flex;}

/* PAGE HEADER */
.page-hd{background:var(--white);border-bottom:1px solid var(--gray-bd);padding:14px 16px;position:sticky;top:0;z-index:50;}
.page-hd h1{font-size:18px;font-weight:700;}
.page-hd-sub{font-size:12px;color:var(--gray);margin-top:1px;}

/* STAT BAR */
.stat-bar{background:var(--white);border-bottom:1px solid var(--gray-bd);display:flex;padding:14px 20px;gap:24px;}
.stat-item{text-align:center;}
.stat-num{font-size:26px;font-weight:800;}
.stat-num.blue{color:var(--blue);}
.stat-num.green{color:var(--green);}
.stat-num.red{color:var(--red);}
.stat-label{font-size:11px;color:var(--gray);font-weight:600;}

/* STUDENT CARD (home) */
.student-list{flex:1;overflow-y:auto;}
.student-card{background:var(--white);border-bottom:1px solid var(--gray-bd);display:flex;align-items:center;padding:14px 16px;gap:12px;cursor:pointer;transition:background 0.1s;}
.student-card:active{background:var(--gray-l);}
.sc-bar{width:4px;height:44px;border-radius:2px;flex-shrink:0;}
.sc-bar.sent{background:var(--green);}
.sc-bar.unsent{background:var(--red);}
.sc-info{flex:1;min-width:0;}
.sc-name{font-size:16px;font-weight:600;}
.sc-meta{font-size:12px;color:var(--gray);margin-top:2px;}
.sc-badges{display:flex;align-items:center;gap:6px;margin-top:4px;}
.sc-arrow{color:var(--gray);font-size:18px;}

/* BADGES */
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;}
.badge-高校生{background:var(--purple-l);color:var(--purple);}
.badge-中学生{background:var(--blue-l);color:var(--blue-dk);}
.badge-小学生{background:var(--green-l);color:#065F46;}
.badge-sent{background:var(--green-l);color:var(--green);}
.badge-unsent{background:var(--red-l);color:var(--red);}

/* CREATE SCREEN */
.create-hd{background:var(--white);border-bottom:1px solid var(--gray-bd);padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;}
.back-btn{border:none;background:none;font-size:28px;cursor:pointer;padding:0 4px;line-height:1;color:var(--navy);}
.create-hd-info{flex:1;}
.create-hd-name{font-size:16px;font-weight:700;}
.create-hd-sub{font-size:12px;color:var(--gray);}

.create-body{flex:1;overflow-y:auto;padding-bottom:24px;}
.create-step{background:var(--white);margin-top:12px;border-top:1px solid var(--gray-bd);border-bottom:1px solid var(--gray-bd);}
.step-label{font-size:11px;font-weight:700;color:var(--gray);padding:12px 16px 8px;letter-spacing:0.06em;text-transform:uppercase;}

/* EVAL BUTTONS */
.eval-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 14px;}
.eval-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:var(--r-sm);border:2px solid var(--gray-bd);background:var(--white);cursor:pointer;transition:all 0.12s;user-select:none;}
.eval-btn:active{transform:scale(0.95);}
.eval-btn .e-emoji{font-size:22px;line-height:1;}
.eval-btn .e-label{font-size:11px;color:var(--gray);text-align:center;line-height:1.3;white-space:pre-line;}
.eval-btn.sel{border-color:var(--blue);background:var(--blue-l);}
.eval-btn.sel .e-label{color:var(--blue-dk);}

/* CHIPS */
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 14px;}
.chip{padding:8px 14px;border-radius:20px;border:2px solid var(--gray-bd);background:var(--white);font-size:13px;cursor:pointer;transition:all 0.12s;user-select:none;white-space:nowrap;}
.chip:active{transform:scale(0.95);}
.chip.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-dk);}

/* NOTE */
.note-wrap{padding:0 16px 14px;}
.note-input{width:100%;border:2px solid var(--gray-bd);border-radius:var(--r-sm);padding:10px 12px;font-family:inherit;font-size:14px;resize:none;outline:none;line-height:1.6;}
.note-input:focus{border-color:var(--blue);}

/* BUTTONS */
.btn{display:block;width:100%;padding:14px;border-radius:var(--r);border:none;font-size:15px;font-weight:700;cursor:pointer;transition:opacity 0.15s;text-align:center;font-family:inherit;}
.btn:active{opacity:0.75;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-blue{background:var(--blue);color:white;}
.btn-green{background:var(--green);color:white;}
.btn-outline{background:transparent;border:2px solid var(--gray-bd);color:var(--navy);}
.btn-red-outline{background:transparent;border:2px solid var(--red);color:var(--red);}

.gen-wrap{padding:12px 16px 0;}
.btn-row{display:flex;gap:8px;}
.btn-row .btn{flex:1;}

/* RESULT */
#result-section{padding:14px 16px;display:none;flex-direction:column;gap:10px;}
#result-section.visible{display:flex;}
.result-label{font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:0.06em;}
.result-ta{width:100%;border:2px solid var(--gray-bd);border-radius:var(--r-sm);padding:12px;font-family:inherit;font-size:14px;line-height:1.8;resize:vertical;outline:none;min-height:160px;}
.result-ta:focus{border-color:var(--blue);}

/* HISTORY */
.history-list{flex:1;overflow-y:auto;}
.history-item{background:var(--white);border-bottom:1px solid var(--gray-bd);padding:14px 16px;cursor:pointer;transition:background 0.1s;}
.history-item:active{background:var(--gray-l);}
.hi-meta{font-size:11px;color:var(--gray);margin-bottom:3px;display:flex;align-items:center;gap:6px;}
.hi-name{font-size:15px;font-weight:600;margin-bottom:4px;}
.hi-preview{font-size:13px;color:var(--gray);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:200;align-items:flex-end;}
.modal-overlay.open{display:flex;}
.modal-sheet{background:var(--white);border-radius:20px 20px 0 0;padding:24px;width:100%;max-height:88dvh;overflow-y:auto;}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;}

/* SETTINGS */
.sub-tabs{display:flex;background:var(--white);border-bottom:1px solid var(--gray-bd);}
.sub-tab{flex:1;padding:12px 4px;border:none;background:none;cursor:pointer;font-size:12px;color:var(--gray);border-bottom:2px solid transparent;font-weight:600;transition:color 0.15s;}
.sub-tab.active{color:var(--blue);border-bottom-color:var(--blue);}

.settings-body{flex:1;overflow-y:auto;padding-bottom:24px;}
.settings-group{margin:12px 16px 0;}
.settings-group label{display:block;font-size:13px;font-weight:600;color:var(--gray);margin-bottom:6px;}
.settings-input{width:100%;border:2px solid var(--gray-bd);border-radius:var(--r-sm);padding:11px 12px;font-size:14px;font-family:inherit;outline:none;background:var(--white);}
.settings-input:focus{border-color:var(--blue);}
.settings-ta{width:100%;border:2px solid var(--gray-bd);border-radius:var(--r-sm);padding:11px 12px;font-size:13px;font-family:inherit;resize:vertical;outline:none;line-height:1.6;min-height:120px;}
.settings-ta:focus{border-color:var(--blue);}
.settings-hint{font-size:12px;color:var(--gray);margin-top:5px;line-height:1.5;}
.api-ok{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;margin-left:8px;}
.api-ok.set{background:var(--green-l);color:var(--green);}
.api-ok.none{background:var(--red-l);color:var(--red);}

/* STUDENT LIST (settings) */
.st-item{background:var(--white);border-bottom:1px solid var(--gray-bd);display:flex;align-items:center;padding:12px 16px;gap:10px;}
.st-item-info{flex:1;min-width:0;}
.st-item-name{font-size:14px;font-weight:600;}
.st-item-meta{font-size:12px;color:var(--gray);margin-top:2px;}
.icon-btn{border:none;background:none;cursor:pointer;font-size:20px;padding:4px;flex-shrink:0;}

/* TOAST */
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:#1E293B;color:white;padding:10px 20px;border-radius:20px;font-size:14px;z-index:500;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

/* LOADING */
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:400;align-items:center;justify-content:center;}
.loading-overlay.open{display:flex;}
.loading-box{background:var(--white);border-radius:var(--r);padding:32px 28px;text-align:center;min-width:200px;}
.spinner{width:40px;height:40px;border:3px solid var(--gray-bd);border-top-color:var(--blue);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:14px;color:var(--gray);}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 24px;color:var(--gray);}
.empty .big{font-size:48px;margin-bottom:12px;}
.empty p{font-size:14px;line-height:1.6;}
</style>
</head>
<body>

<!-- ── HOME SCREEN ── -->
<div id="screen-home" class="screen active">
  <div class="page-hd">
    <h1>保護者連絡</h1>
    <div class="page-hd-sub" id="home-month-label"></div>
  </div>
  <div class="stat-bar">
    <div class="stat-item"><div class="stat-num blue" id="stat-total">0</div><div class="stat-label">全生徒</div></div>
    <div class="stat-item"><div class="stat-num green" id="stat-sent">0</div><div class="stat-label">送信済</div></div>
    <div class="stat-item"><div class="stat-num red" id="stat-unsent">0</div><div class="stat-label">未送信</div></div>
  </div>
  <div class="student-list" id="home-student-list"></div>
</div>

<!-- ── CREATE SCREEN ── -->
<div id="screen-create" class="screen">
  <div class="create-hd">
    <button class="back-btn" onclick="goHome()">‹</button>
    <div class="create-hd-info">
      <div class="create-hd-name" id="create-sname">—</div>
      <div class="create-hd-sub" id="create-sparent"></div>
    </div>
    <div id="create-slevel"></div>
  </div>

  <div class="create-body">
    <!-- STEP 1: Evaluation -->
    <div class="create-step">
      <div class="step-label">Step 1 · 全体評価</div>
      <div class="eval-grid" id="eval-grid"></div>
    </div>

    <!-- STEP 2: Points chips -->
    <div class="create-step">
      <div class="step-label">Step 2 · 具体的なポイント（複数可）</div>
      <div class="chip-wrap" id="chip-wrap"></div>
    </div>

    <!-- STEP 3: Free note -->
    <div class="create-step">
      <div class="step-label">Step 3 · 一言メモ（教科・様子など）</div>
      <div class="note-wrap">
        <textarea class="note-input" id="note-input" rows="3" placeholder="例: 今日は数学、集中して取り組んでいた。発言も多かった。&#10;例: 英語の小テストで満点だった。"></textarea>
      </div>
    </div>

    <!-- GENERATE -->
    <div class="gen-wrap">
      <button class="btn btn-blue" id="gen-btn" onclick="onGenerate()">✨ AI生成</button>
    </div>

    <!-- RESULT -->
    <div id="result-section">
      <div class="result-label">生成された報告文</div>
      <textarea class="result-ta" id="result-ta" rows="7"></textarea>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="onCopy()">📋 コピー</button>
        <button class="btn btn-green" onclick="onMarkSent()">✓ 送信済みにする</button>
      </div>
      <button class="btn btn-outline" onclick="onGenerate()" style="margin-top:0;">🔄 再生成</button>
    </div>
  </div>
</div>

<!-- ── HISTORY SCREEN ── -->
<div id="screen-history" class="screen">
  <div class="page-hd"><h1>送信履歴</h1></div>
  <div class="history-list" id="history-list"></div>
</div>

<!-- ── SETTINGS SCREEN ── -->
<div id="screen-settings" class="screen">
  <div class="page-hd"><h1>設定</h1></div>
  <div class="sub-tabs">
    <button class="sub-tab active" id="stab-api" onclick="showSettingsTab('api')">APIキー</button>
    <button class="sub-tab" id="stab-style" onclick="showSettingsTab('style')">文体サンプル</button>
    <button class="sub-tab" id="stab-students" onclick="showSettingsTab('students')">生徒管理</button>
  </div>
  <div class="settings-body" id="settings-body"></div>
</div>

<!-- ── BOTTOM NAV ── -->
<nav class="bottom-nav">
  <button class="nav-tab active" id="tab-home" onclick="showTab('home')"><span class="ni">🏠</span>ホーム</button>
  <button class="nav-tab" id="tab-history" onclick="showTab('history')"><span class="ni">📋</span>履歴</button>
  <button class="nav-tab" id="tab-settings" onclick="showTab('settings')"><span class="ni">⚙️</span>設定</button>
</nav>

<!-- ── REPORT DETAIL MODAL ── -->
<div class="modal-overlay" id="modal-report">
  <div class="modal-sheet">
    <div class="modal-title" id="mreport-title"></div>
    <div style="font-size:12px;color:var(--gray);margin-bottom:12px;" id="mreport-meta"></div>
    <div style="font-size:14px;line-height:1.8;white-space:pre-wrap;margin-bottom:20px;" id="mreport-body"></div>
    <div class="btn-row" style="margin-bottom:10px;">
      <button class="btn btn-outline" onclick="copyReportModal()">📋 コピー</button>
      <button class="btn btn-red-outline" onclick="deleteReportModal()">削除</button>
    </div>
    <button class="btn btn-outline" onclick="closeModal('modal-report')">閉じる</button>
  </div>
</div>

<!-- ── STUDENT EDIT MODAL ── -->
<div class="modal-overlay" id="modal-student">
  <div class="modal-sheet">
    <div class="modal-title" id="mstudent-title">生徒追加</div>
    <input type="hidden" id="mst-id">
    <div class="settings-group">
      <label>生徒名 <span style="color:var(--red)">*</span></label>
      <input class="settings-input" type="text" id="mst-name" placeholder="例: 山田 太郎">
    </div>
    <div class="settings-group">
      <label>保護者名</label>
      <input class="settings-input" type="text" id="mst-parent" placeholder="例: 山田 花子">
    </div>
    <div class="settings-group">
      <label>学年区分 <span style="color:var(--red)">*</span></label>
      <select class="settings-input" id="mst-level">
        <option value="高校生">高校生</option>
        <option value="中学生">中学生</option>
        <option value="小学生">小学生</option>
      </select>
    </div>
    <div class="settings-group">
      <label>メモ（任意）</label>
      <input class="settings-input" type="text" id="mst-note" placeholder="自由メモ">
    </div>
    <div class="btn-row" style="margin:16px 16px 0;">
      <button class="btn btn-outline" onclick="closeModal('modal-student')">キャンセル</button>
      <button class="btn btn-blue" onclick="saveStudent()">保存</button>
    </div>
  </div>
</div>

<!-- ── LOADING ── -->
<div class="loading-overlay" id="loading">
  <div class="loading-box">
    <div class="spinner"></div>
    <div class="loading-text">AIが文章を生成中...</div>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<script>
// ─── CONSTANTS ────────────────────────────────────────────
const LEVELS = ['高校生', '中学生', '小学生'];

const LEVEL_CHIPS = {
  '高校生': [
    '授業への取り組みが良い','自主学習ができている','進路への意識が高い',
    '課題の提出が安定','友人関係が良好','質問・相談ができている',
    '自己管理ができている','積極的に発言している','気分が安定している',
    '体調が安定している','欠席が続いている','遅刻が目立つ',
    '提出物に遅れがある','気分が不安定'
  ],
  '中学生': [
    '授業に集中できている','積極的に発言している','提出物が安定',
    '友人関係が良好','自主的に取り組んでいる','挨拶がしっかりできている',
    '部活動に熱心','気分が安定している','体調が安定している',
    '欠席が続いている','遅刻が目立つ','提出物に遅れがある','気分が不安定'
  ],
  '小学生': [
    '積極的に発言している','友達と仲良くできている','提出物が揃っている',
    '集中して取り組んでいる','休み時間も元気','発言が増えてきた',
    '落ち着いて過ごせている','体調が安定している',
    '欠席が続いている','元気がない様子','忘れ物が多い'
  ]
};

const EVALS = [
  {emoji:'👍', label:'全体\n良好'},
  {emoji:'📈', label:'成長\nあり'},
  {emoji:'⚠️', label:'要\n注意'},
  {emoji:'🏠', label:'欠席\n体調'},
  {emoji:'💬', label:'その他'},
];

// ─── STORAGE ─────────────────────────────────────────────
const K = {
  students: 'pr_students',
  reports:  'pr_reports',
  apiKey:   'pr_api_key',
  styles:   'pr_styles',
};

function load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) ?? def; }
  catch { return def; }
}
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
function getStudents() { return load(K.students, []); }
function getReports()  { return load(K.reports, []); }
function getApiKey()   { return localStorage.getItem(K.apiKey) || ''; }
function getStyles()   { return load(K.styles, {高校生:'',中学生:'',小学生:''}); }

// ─── STATE ───────────────────────────────────────────────
let currentStudent = null;
let selectedEval   = null;
let selectedChips  = [];
let settingsTabNow = 'api';
let modalReportId  = null;

// ─── UTILS ───────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function currentYM() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function isSentThisMonth(studentId) {
  const m = currentYM();
  return getReports().some(r => r.studentId === studentId && r.sentAt && r.sentAt.startsWith(m));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function setLoading(on) {
  document.getElementById('loading').classList.toggle('open', on);
}

function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── NAVIGATION ──────────────────────────────────────────
function showTab(tab) {
  ['home','history','settings'].forEach(t => {
    document.getElementById('screen-'+t).classList.toggle('active', t===tab);
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
  });
  document.getElementById('screen-create').classList.remove('active');
  if (tab === 'home')     renderHome();
  if (tab === 'history')  renderHistory();
  if (tab === 'settings') renderSettings();
}

function goHome() { showTab('home'); }

// ─── HOME ────────────────────────────────────────────────
function renderHome() {
  const students = getStudents();
  const d = new Date();
  document.getElementById('home-month-label').textContent = `${d.getMonth()+1}月の連絡状況`;

  const sentCount = students.filter(s => isSentThisMonth(s.id)).length;
  document.getElementById('stat-total').textContent  = students.length;
  document.getElementById('stat-sent').textContent   = sentCount;
  document.getElementById('stat-unsent').textContent = students.length - sentCount;

  const el = document.getElementById('home-student-list');
  if (!students.length) {
    el.innerHTML = `<div class="empty"><div class="big">👥</div><p>まだ生徒が登録されていません。<br>設定 → 生徒管理から追加してください。</p></div>`;
    return;
  }

  const sorted = [...students].sort((a,b) => {
    const as = isSentThisMonth(a.id), bs = isSentThisMonth(b.id);
    return as === bs ? 0 : (as ? 1 : -1);
  });

  el.innerHTML = sorted.map(s => {
    const sent = isSentThisMonth(s.id);
    return `<div class="student-card" onclick="startCreate('${s.id}')">
      <div class="sc-bar ${sent?'sent':'unsent'}"></div>
      <div class="sc-info">
        <div class="sc-name">${esc(s.name)}</div>
        <div class="sc-meta">${esc(s.parentName||'—')}</div>
        <div class="sc-badges">
          <span class="badge badge-${s.level}">${s.level}</span>
          <span class="badge badge-${sent?'sent':'unsent'}">${sent?'✓ 送信済':'未送信'}</span>
        </div>
      </div>
      <div class="sc-arrow">›</div>
    </div>`;
  }).join('');
}

// ─── CREATE ───────────────────────────────────────────────
function startCreate(studentId) {
  const s = getStudents().find(x => x.id === studentId);
  if (!s) return;
  currentStudent = s;
  selectedEval   = null;
  selectedChips  = [];

  document.getElementById('create-sname').textContent  = s.name;
  document.getElementById('create-sparent').textContent = s.parentName ? `保護者: ${s.parentName}` : '';
  document.getElementById('create-slevel').innerHTML    = `<span class="badge badge-${s.level}">${s.level}</span>`;
  document.getElementById('note-input').value = '';

  // Render evaluation buttons
  document.getElementById('eval-grid').innerHTML = EVALS.map((e,i) =>
    `<button class="eval-btn" id="eval-${i}" onclick="selectEval(${i})">
      <span class="e-emoji">${e.emoji}</span>
      <span class="e-label">${e.label}</span>
    </button>`
  ).join('');

  // Render chips for this school level
  const chips = LEVEL_CHIPS[s.level] || [];
  document.getElementById('chip-wrap').innerHTML = chips.map(c =>
    `<div class="chip" data-chip="${esc(c)}" onclick="toggleChip(this)">${esc(c)}</div>`
  ).join('');

  // Hide result
  document.getElementById('result-section').classList.remove('visible');
  document.getElementById('result-ta').value = '';

  // Show create screen, hide others
  ['home','history','settings'].forEach(t => {
    document.getElementById('screen-'+t).classList.remove('active');
    document.getElementById('tab-'+t).classList.remove('active');
  });
  document.getElementById('screen-create').classList.add('active');
  document.querySelector('.create-body').scrollTop = 0;
}

function selectEval(idx) {
  selectedEval = `${EVALS[idx].emoji} ${EVALS[idx].label.replace('\n','')}`;
  document.querySelectorAll('.eval-btn').forEach((b,i) => b.classList.toggle('sel', i===idx));
}

function toggleChip(el) {
  const label = el.dataset.chip;
  const idx = selectedChips.indexOf(label);
  if (idx === -1) { selectedChips.push(label); el.classList.add('sel'); }
  else            { selectedChips.splice(idx,1); el.classList.remove('sel'); }
}

async function onGenerate() {
  if (!selectedEval) { showToast('全体評価を選んでください'); return; }
  const apiKey = getApiKey();
  if (!apiKey) { showToast('設定でAPIキーを登録してください'); showTab('settings'); return; }

  setLoading(true);
  try {
    const text = await generateReport(
      currentStudent,
      selectedEval,
      selectedChips,
      document.getElementById('note-input').value.trim()
    );
    document.getElementById('result-ta').value = text;
    const rs = document.getElementById('result-section');
    rs.classList.add('visible');
    setTimeout(() => rs.scrollIntoView({behavior:'smooth', block:'nearest'}), 100);
  } catch(e) {
    showToast('エラー: ' + (e.message || '生成に失敗しました'));
  } finally {
    setLoading(false);
  }
}

function onCopy() {
  const text = document.getElementById('result-ta').value;
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => showToast('コピーしました'));
}

function onMarkSent() {
  const text = document.getElementById('result-ta').value;
  if (!text) { showToast('先に文章を生成してください'); return; }
  const reports = getReports();
  reports.unshift({
    id: uid(),
    studentId:   currentStudent.id,
    studentName: currentStudent.name,
    level:       currentStudent.level,
    body:        text,
    sentAt:      new Date().toISOString()
  });
  save(K.reports, reports);
  navigator.clipboard.writeText(text).catch(() => {});
  showToast('送信済みに記録しました');
  setTimeout(() => goHome(), 800);
}

// ─── AI GENERATION ────────────────────────────────────────
async function generateReport(student, evalType, chips, note) {
  const apiKey = getApiKey();
  const styles = getStyles();
  const styleSample = (styles[student.level] || '').trim();

  const systemPrompt = styleSample
    ? `あなたは保護者への連絡文を書くアシスタントです。以下の例文を参考に、同じ文体・口調・言い回しで連絡文を生成してください。出力は連絡文のみ（前置き・説明なし）。\n\n【文体サンプル（${student.level}）】\n${styleSample}`
    : 'あなたは保護者への連絡文を書くアシスタントです。丁寧で温かみのある文体で連絡文を生成してください。出力は連絡文のみ（前置き・説明なし）。';

  const chipsText = chips.length ? chips.join('、') : '（特になし）';
  const userPrompt = `以下の情報で保護者への連絡文を生成してください。

生徒名: ${student.name}
保護者: ${student.parentName ? student.parentName + '様' : '保護者様'}
学年区分: ${student.level}
全体評価: ${evalType}
具体的なポイント: ${chipsText}
追加メモ: ${note || '（なし）'}

連絡文のみ出力してください。`;

  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-opus-4-8',
      max_tokens: 1024,
      system: systemPrompt,
      messages: [{role: 'user', content: userPrompt}]
    })
  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTPエラー ${resp.status}`);
  }
  const data = await resp.json();
  return data.content[0].text;
}

// ─── HISTORY ─────────────────────────────────────────────
function renderHistory() {
  const reports = getReports();
  const el = document.getElementById('history-list');
  if (!reports.length) {
    el.innerHTML = `<div class="empty"><div class="big">📋</div><p>まだ送信履歴がありません。</p></div>`;
    return;
  }
  el.innerHTML = reports.map(r => {
    const d = new Date(r.sentAt);
    const dateStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `<div class="history-item" onclick="openReportModal('${r.id}')">
      <div class="hi-meta">
        ${dateStr}
        <span class="badge badge-${r.level}" style="font-size:10px;">${r.level}</span>
      </div>
      <div class="hi-name">${esc(r.studentName)}</div>
      <div class="hi-preview">${esc(r.body)}</div>
    </div>`;
  }).join('');
}

function openReportModal(id) {
  const r = getReports().find(x => x.id === id);
  if (!r) return;
  modalReportId = id;
  const d = new Date(r.sentAt);
  document.getElementById('mreport-title').textContent = r.studentName;
  document.getElementById('mreport-meta').textContent  = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} · ${r.level}`;
  document.getElementById('mreport-body').textContent  = r.body;
  openModal('modal-report');
}

function copyReportModal() {
  const text = document.getElementById('mreport-body').textContent;
  navigator.clipboard.writeText(text).then(() => showToast('コピーしました'));
}

function deleteReportModal() {
  if (!confirm('この履歴を削除しますか？')) return;
  save(K.reports, getReports().filter(r => r.id !== modalReportId));
  closeModal('modal-report');
  renderHistory();
  showToast('削除しました');
}

// ─── SETTINGS ─────────────────────────────────────────────
function showSettingsTab(tab) {
  settingsTabNow = tab;
  ['api','style','students'].forEach(t =>
    document.getElementById('stab-'+t).classList.toggle('active', t===tab)
  );
  renderSettings();
}

function renderSettings() {
  const body = document.getElementById('settings-body');
  const tab  = settingsTabNow;

  if (tab === 'api') {
    const apiKey = getApiKey();
    const status = apiKey
      ? `<span class="api-ok set">✓ 設定済み</span>`
      : `<span class="api-ok none">未設定</span>`;
    body.innerHTML = `
      <div class="settings-group">
        <label>Claude APIキー ${status}</label>
        <input class="settings-input" type="password" id="api-key-input" value="${esc(apiKey)}" placeholder="sk-ant-...">
        <div class="settings-hint">Anthropic Consoleで取得したAPIキーを入力してください。このデバイスにのみ保存されます。</div>
      </div>
      <div class="settings-group">
        <button class="btn btn-blue" onclick="saveApiKey()">保存</button>
      </div>
      <div class="settings-group">
        <div class="settings-hint" style="font-size:11px;margin-top:4px;">使用モデル: claude-opus-4-8</div>
      </div>`;
    return;
  }

  if (tab === 'style') {
    const styles = getStyles();
    body.innerHTML = `
      <div style="padding:12px 16px 6px;font-size:13px;color:var(--gray);line-height:1.6;">
        過去に書いた報告文を貼り付けると、AIがその文体を真似て文章を生成します。複数の文例を改行で区切って貼り付けてください。
      </div>
      ${LEVELS.map(lv => `
        <div class="settings-group">
          <label>${lv}の文体サンプル</label>
          <textarea class="settings-ta" id="style-${lv}" rows="5" placeholder="過去の報告文を貼り付けてください...">${esc(styles[lv]||'')}</textarea>
        </div>`).join('')}
      <div class="settings-group">
        <button class="btn btn-blue" onclick="saveStyles()">保存</button>
      </div>`;
    return;
  }

  if (tab === 'students') {
    const students = getStudents();
    const listHtml = students.length
      ? students.map(s => `
          <div class="st-item">
            <div class="st-item-info">
              <div class="st-item-name">${esc(s.name)}</div>
              <div class="st-item-meta">
                ${esc(s.parentName||'—')} ·
                <span class="badge badge-${s.level}" style="font-size:10px;">${s.level}</span>
              </div>
            </div>
            <button class="icon-btn" onclick="editStudent('${s.id}')">✏️</button>
            <button class="icon-btn" onclick="deleteStudent('${s.id}')">🗑️</button>
          </div>`).join('')
      : `<div class="empty" style="padding:32px 24px;"><p>まだ生徒がいません</p></div>`;

    body.innerHTML = `
      <div class="settings-group">
        <button class="btn btn-blue" onclick="openAddStudent()">＋ 生徒を追加</button>
      </div>
      <div style="margin-top:12px;">${listHtml}</div>`;
  }
}

function saveApiKey() {
  const val = document.getElementById('api-key-input').value.trim();
  localStorage.setItem(K.apiKey, val);
  showToast('APIキーを保存しました');
  renderSettings();
}

function saveStyles() {
  const styles = {};
  LEVELS.forEach(lv => {
    const el = document.getElementById('style-'+lv);
    if (el) styles[lv] = el.value.trim();
  });
  save(K.styles, styles);
  showToast('文体サンプルを保存しました');
}

// ─── STUDENT CRUD ────────────────────────────────────────
function openAddStudent() {
  document.getElementById('mstudent-title').textContent = '生徒追加';
  document.getElementById('mst-id').value     = '';
  document.getElementById('mst-name').value   = '';
  document.getElementById('mst-parent').value = '';
  document.getElementById('mst-level').value  = '中学生';
  document.getElementById('mst-note').value   = '';
  openModal('modal-student');
}

function editStudent(id) {
  const s = getStudents().find(x => x.id === id);
  if (!s) return;
  document.getElementById('mstudent-title').textContent = '生徒編集';
  document.getElementById('mst-id').value     = id;
  document.getElementById('mst-name').value   = s.name;
  document.getElementById('mst-parent').value = s.parentName || '';
  document.getElementById('mst-level').value  = s.level;
  document.getElementById('mst-note').value   = s.note || '';
  openModal('modal-student');
}

function saveStudent() {
  const name = document.getElementById('mst-name').value.trim();
  if (!name) { showToast('生徒名を入力してください'); return; }
  const id       = document.getElementById('mst-id').value;
  const students = getStudents();
  const obj = {
    id:         id || uid(),
    name,
    parentName: document.getElementById('mst-parent').value.trim(),
    level:      document.getElementById('mst-level').value,
    note:       document.getElementById('mst-note').value.trim(),
  };
  if (id) {
    const idx = students.findIndex(x => x.id === id);
    if (idx !== -1) students[idx] = obj;
  } else {
    students.push(obj);
  }
  save(K.students, students);
  closeModal('modal-student');
  showToast(id ? '更新しました' : '生徒を追加しました');
  renderSettings();
}

function deleteStudent(id) {
  const s = getStudents().find(x => x.id === id);
  if (!s || !confirm(`「${s.name}」を削除しますか？`)) return;
  save(K.students, getStudents().filter(x => x.id !== id));
  showToast('削除しました');
  renderSettings();
}

// ─── CLOSE MODALS ON BACKDROP CLICK ─────────────────────
document.querySelectorAll('.modal-overlay').forEach(el =>
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); })
);

// ─── INIT ────────────────────────────────────────────────
renderHome();
</script>
